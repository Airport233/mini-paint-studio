<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 — HobbyMix</title>
<style>
  :root {
    --bg:           #313338;
    --surface:      #2b2d31;
    --surface-warm: #1e1f22;
    --fg:           #dbdee1;
    --fg-2:         #f2f3f5;
    --muted:        #949ba4;
    --meta:         #80848e;
    --border:       rgba(255, 255, 255, 0.06);
    --border-solid: #3f4147;
    --accent:       #5865f2;
    --accent-hover: #4752c4;
    --danger:       #f23f43;
    --success:      #23a55a;
    --radius-sm:    4px;
    --radius-md:    8px;
    --font:         "gg sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono:         "gg mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .auth-card {
    width: 420px;
    max-width: 95vw;
    background: var(--surface);
    border-radius: var(--radius-md);
    border: 1px solid var(--border-solid);
    padding: 40px 36px;
  }

  .brand {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    color: var(--fg-2);
    margin-bottom: 8px;
    cursor: pointer;
  }
  .brand span { color: var(--accent); }

  .view-title {
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    color: var(--fg-2);
    margin-bottom: 24px;
  }

  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: var(--surface-warm);
    border: 1px solid var(--border-solid);
    color: var(--fg);
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .field input:focus {
    border-color: var(--accent);
  }
  .field input::placeholder {
    color: var(--meta);
  }

  .field-error {
    font-size: 12px;
    color: var(--danger);
    margin-top: 4px;
    display: none;
  }
  .field-error.visible { display: block; }

  .btn {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    border: none;
    font-family: inherit;
    margin-top: 4px;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover {
    background: var(--accent-hover);
  }

  .switch-links {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
  }
  .switch-links a {
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
    margin: 0 6px;
    transition: color 0.15s;
  }
  .switch-links a:hover {
    color: #fff;
  }
  .switch-links .sep {
    color: var(--meta);
    margin: 0 2px;
  }

  .view {
    display: none;
  }
  .view.active {
    display: block;
  }

  .back-link {
    text-align: center;
    margin-top: 24px;
    font-size: 13px;
    color: var(--meta);
  }
  .back-link a {
    color: var(--muted);
    text-decoration: none;
    cursor: pointer;
  }
  .back-link a:hover {
    color: var(--fg);
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border-solid);
    border-radius: var(--radius-sm);
    padding: 12px 24px;
    font-size: 13px;
    color: var(--fg-2);
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
  }
  .toast.success {
    border-color: var(--success);
  }
  .toast.error {
    border-color: var(--danger);
  }
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="js/api.js"></script>
</head>
<body>

<div class="auth-card">

  <div class="brand"><i data-lucide="palette" class="nav-icon"></i> <span>Hobby</span>Mix</div>

  <!-- Login view -->
  <div class="view active" id="view-login">
    <div class="view-title">登入账号</div>
    <form id="form-login" onsubmit="return handleLogin(event)">
      <div class="field">
        <label>邮箱</label>
        <input type="email" id="login-email" placeholder="请输入邮箱地址" required autocomplete="email">
        <span class="field-error" id="err-login-email"></span>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="login-password" placeholder="请输入密码" required autocomplete="current-password">
        <span class="field-error" id="err-login-password"></span>
      </div>
      <button type="submit" class="btn btn-primary">登入</button>
    </form>
    <div class="switch-links">
      <a onclick="switchView('register')">注册</a>
      <span class="sep">·</span>
      <a onclick="switchView('forgot')">忘记密码</a>
    </div>
  </div>

  <!-- Register view -->
  <div class="view" id="view-register">
    <div class="view-title">创建账号</div>
    <form id="form-register" onsubmit="return handleRegister(event)">
      <div class="field">
        <label>邮箱</label>
        <input type="email" id="reg-email" placeholder="请输入邮箱地址" required autocomplete="email">
        <span class="field-error" id="err-reg-email"></span>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="reg-password" placeholder="至少 8 位，含字母和数字" required autocomplete="new-password">
        <span class="field-error" id="err-reg-password"></span>
      </div>
      <div class="field">
        <label>确认密码</label>
        <input type="password" id="reg-confirm" placeholder="再次输入密码" required autocomplete="new-password">
        <span class="field-error" id="err-reg-confirm"></span>
      </div>
      <button type="submit" class="btn btn-primary">创建账号</button>
    </form>
    <div class="switch-links">
      已有账号？<a onclick="switchView('login')">返回登录</a>
    </div>
  </div>

  <!-- Forgot password view -->
  <div class="view" id="view-forgot">
    <div class="view-title">重置密码</div>
    <form id="form-forgot" onsubmit="return handleForgot(event)">
      <div class="field">
        <label>邮箱</label>
        <input type="email" id="forgot-email" placeholder="请输入注册邮箱" required autocomplete="email">
        <span class="field-error" id="err-forgot-email"></span>
      </div>
      <button type="submit" class="btn btn-primary">发送重置链接</button>
    </form>
    <div class="switch-links">
      <a onclick="switchView('login')">返回登录</a>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  // ---- View switching ----
  function switchView(name) {
    document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
    document.getElementById('view-' + name).classList.add('active');
    // Clear visible errors
    document.querySelectorAll('.field-error').forEach(function(e) { e.classList.remove('visible'); });
  }

  // ---- Toast ----
  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || '') + ' show';
    clearTimeout(t._timer);
    t._timer = setTimeout(function() { t.classList.remove('show'); }, 3000);
  }

  // ---- Field error helper ----
  function setError(id, msg) {
    var el = document.getElementById(id);
    el.textContent = msg;
    el.classList.toggle('visible', !!msg);
  }

  // ---- Login ----
  function handleLogin(e) {
    e.preventDefault();
    var email = document.getElementById('login-email').value.trim();
    var pw = document.getElementById('login-password').value;
    var valid = true;

    if (!email) { setError('err-login-email', '请输入邮箱地址'); valid = false; }
    else if (!/\S+@\S+\.\S+/.test(email)) { setError('err-login-email', '邮箱格式不正确'); valid = false; }
    else { setError('err-login-email', ''); }

    if (!pw) { setError('err-login-password', '请输入密码'); valid = false; }
    else { setError('err-login-password', ''); }

    if (!valid) return false;

    authLogin(email, pw).then(function(resp) {
      localStorage.setItem('token', resp.token);
      localStorage.setItem('email', resp.email);
      location.href = 'index.html';
    }).catch(function(err) {
      showToast('登录失败: ' + err.message, 'error');
    });
    return false;
  }

  // ---- Register ----
  function handleRegister(e) {
    e.preventDefault();
    var email = document.getElementById('reg-email').value.trim();
    var pw = document.getElementById('reg-password').value;
    var confirm = document.getElementById('reg-confirm').value;
    var valid = true;

    if (!email) { setError('err-reg-email', '请输入邮箱地址'); valid = false; }
    else if (!/\S+@\S+\.\S+/.test(email)) { setError('err-reg-email', '邮箱格式不正确'); valid = false; }
    else { setError('err-reg-email', ''); }

    if (!pw) { setError('err-reg-password', '请输入密码'); valid = false; }
    else if (pw.length < 8) { setError('err-reg-password', '密码长度不足 8 位'); valid = false; }
    else { setError('err-reg-password', ''); }

    if (!confirm) { setError('err-reg-confirm', '请确认密码'); valid = false; }
    else if (confirm !== pw) { setError('err-reg-confirm', '两次密码不一致'); valid = false; }
    else { setError('err-reg-confirm', ''); }

    if (!valid) return false;

    authRegister(email, pw).then(function(resp) {
      localStorage.setItem('token', resp.token);
      localStorage.setItem('email', resp.email);
      location.href = 'index.html';
    }).catch(function(err) {
      showToast('注册失败: ' + err.message, 'error');
    });
    return false;
  }

  // ---- Forgot password ----
  function handleForgot(e) {
    e.preventDefault();
    var email = document.getElementById('forgot-email').value.trim();
    if (!email) { setError('err-forgot-email', '请输入邮箱地址'); return false; }
    if (!/\S+@\S+\.\S+/.test(email)) { setError('err-forgot-email', '邮箱格式不正确'); return false; }
    setError('err-forgot-email', '');

    authForgotPassword(email).then(function() {
      showToast('如果该邮箱已注册，重置链接已发送', 'success');
    }).catch(function() {
      showToast('如果该邮箱已注册，重置链接已发送', 'success');
    });
    return false;
  }
lucide.createIcons();
</script>
</body>
</html>
