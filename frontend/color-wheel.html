﻿<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>色彩工具 - HobbyMix</title>
<style>
:root{--bg:#313338;--surface:#2b2d31;--surface2:#1e1f22;--fg:#dbdee1;--fg2:#f2f3f5;--muted:#949ba4;--meta:#80848e;--border:rgba(255,255,255,0.06);--borders:#3f4147;--accent:#5865f2;--accent-h:#4752c4;--success:#23a55a;--warn:#f0b232;--danger:#f23f43;--radius-sm:4px;--radius-md:8px;--font:"gg sans","Helvetica Neue",Helvetica,Arial,sans-serif;--mono:"gg mono",Consolas,"Courier New",monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);display:flex;height:100vh;overflow:hidden}
nav{width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 8px}
nav .brand{font-size:16px;font-weight:700;color:var(--fg-2);padding:0 8px 20px}
nav .brand span{color:var(--accent)}
nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius-sm);color:var(--meta);text-decoration:none;font-size:15px;font-weight:500;transition:.15s;margin-bottom:2px}
nav a .nav-icon{width:18px;height:18px;flex-shrink:0}
nav a:hover,nav a.active{background:rgba(78,80,88,0.3);color:var(--fg)}
nav a.active{background:rgba(78,80,88,0.6)}
main{flex:1;overflow-y:auto;padding:32px 40px}
h1{font-size:24px;font-weight:700;color:var(--fg-2);margin-bottom:4px}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:20px}
.tab-bar{display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--border)}
.tab-btn{padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s;font-family:var(--font)}
.tab-btn:hover{color:var(--fg)}
.tab-btn.active{color:var(--fg-2);border-bottom-color:var(--accent)}
.layout{display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap}
.wheel-area{flex-shrink:0;text-align:center}
canvas{cursor:grab;border-radius:50%}
canvas.dragging{cursor:grabbing}
.schemes{display:flex;gap:8px;margin-top:16px;justify-content:center}
.scheme-btn{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border-soft);background:transparent;color:var(--muted);transition:.15s}
.scheme-btn:hover,.scheme-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.swatches-panel{flex:1;min-width:280px}
.swatch-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius-sm);background:var(--surface);margin-bottom:8px;border:1px solid var(--border)}
.swatch-row .dot{width:48px;height:48px;border-radius:50%;flex-shrink:0;border:2px solid var(--border-soft)}
.swatch-row .info{flex:1}
.swatch-row .info .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.swatch-row .info .hex{font-family:var(--mono);font-size:15px;color:var(--fg-2);margin-top:2px}
.swatch-row .info .vals{font-size:12px;color:var(--meta);margin-top:2px}
.ref-color{margin-top:24px;padding:16px;background:var(--surface);border-radius:var(--radius-md);border:1px solid var(--border)}
.ref-color h3{font-size:14px;font-weight:700;color:var(--fg-2);margin-bottom:8px}
.cp-row{display:flex;align-items:center;gap:8px;position:relative}
.cp-swatch{width:36px;height:36px;border-radius:var(--radius-sm);cursor:pointer;border:2px solid var(--border-soft);flex-shrink:0;transition:border-color .15s}
.cp-swatch:hover{border-color:var(--fg)}
.cp-rgb{display:flex;gap:4px;flex:1}
.cp-field{flex:1;min-width:0}
.cp-field label{display:block;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.cp-field input{width:100%;padding:4px 4px;font-size:11px;font-family:var(--mono);text-align:center;margin-bottom:0!important}
.cp-field input[type=number]::-webkit-inner-spin-button,.cp-field input[type=number]::-webkit-outer-spin-button{opacity:1;height:18px}
.go-mix-btn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:8px 14px;background:var(--accent);color:var(--accent-on);border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;text-decoration:none}
.go-mix-btn:hover{background:var(--accent-hover)}
.gamut-layout{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.gamut-canvas-area{position:relative;flex-shrink:0;text-align:center}
#gamut-canvas{border-radius:50%;cursor:crosshair}
.gamut-hint{font-size:11px;color:var(--meta);text-align:center;margin-top:8px;max-width:440px}
.gamut-panel{flex:1;min-width:260px}
.anchor-list{margin-bottom:16px}
.anchor-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface);margin-bottom:6px;border:1px solid var(--border);font-size:13px}
.anchor-item .a-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);flex-shrink:0}
.anchor-item .a-info{flex:1;min-width:0}
.anchor-item .a-hex{font-family:var(--mono);font-size:14px;color:var(--fg-2)}
.anchor-item .a-hs{font-size:11px;color:var(--meta);margin-top:1px}
.anchor-item .a-del{width:24px;height:24px;border-radius:50%;border:none;background:rgba(255,255,255,0.06);color:var(--meta);cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center;transition:.15s;flex-shrink:0}
.anchor-item .a-del:hover{background:var(--danger);color:#fff}
.lock-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:rgba(255,255,255,0.06);color:var(--meta);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11px;font-family:var(--font-body);cursor:pointer;transition:.15s}
.lock-btn:hover{color:var(--fg-2);border-color:var(--muted)}
.lock-btn.locked{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
.picked-block{margin-top:0;padding:14px 16px;background:var(--surface);border-radius:var(--radius-md);border:1px solid var(--border)}
.picked-block h3{font-size:14px;font-weight:700;color:var(--fg-2);margin-bottom:10px}
.picked-block .picked-swatch{width:40px;height:40px;border-radius:var(--radius-sm);border:2px solid var(--border-soft);flex-shrink:0}
.btn-secondary{padding:8px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;background:#4e5058;color:#fff;border:none;transition:.15s;font-family:var(--font);display:inline-flex;align-items:center;gap:5px}
.btn-secondary:hover{background:#6d6f78}
.go-mix-mini{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-on);text-decoration:none;transition:background .15s;flex-shrink:0;margin-left:auto}
.go-mix-mini:hover{background:var(--accent-hover)}
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="css/layout.css">
<script src="js/layout.js"></script>

<body>
<div id="sidebar"></div>
<nav>
<div class="brand"><i data-lucide="palette" class="nav-icon"></i> <span>Hobby</span>Mix</div>
<a href="/"><i data-lucide="home" class="nav-icon"></i> 首页</a>

</nav>
<main>
<h1>色彩工具</h1>
<p class="subtitle">色轮探索色彩关系 · 色域映射混色范围</p>
<div class="tab-bar">
<button class="tab-btn active" data-tab="wheel">色轮</button>
<button class="tab-btn" data-tab="gamut">色域</button>
</div>
<div id="tab-wheel">
<div class="layout">
<div class="wheel-area">
<canvas id="wheel" width="340" height="340"></canvas>
<div class="schemes">
<button class="scheme-btn active" data-scheme="complementary">互补</button>
<button class="scheme-btn" data-scheme="triadic">三角</button>
<button class="scheme-btn" data-scheme="tetradic">四角</button>
<button class="scheme-btn" data-scheme="analogous">类似</button>
<button class="scheme-btn" data-scheme="split">分裂互补</button>
</div>

<div id="swatches"></div>

<div class="cp-row" style="margin-bottom:8px">
<div class="cp-swatch" id="cw-swatch" style="background:rgb(88,101,242)" onclick="document.getElementById('cw-native').click()"></div>
<input type="color" id="cw-native" value="#5865F2" style="position:absolute;opacity:0;width:0;height:0;pointer-events:none" tabindex="-1">
<div class="cp-rgb">
<div class="cp-field"><label>R</label><input type="number" min="0" max="255" value="88" id="cw-r"></div>
<div class="cp-field"><label>G</label><input type="number" min="0" max="255" value="101" id="cw-g"></div>

</div>
</div>
<label style="font-size:11px;color:var(--muted);margin-bottom:4px;display:block">Hue H <span id="cw-h-val" style="font-family:var(--mono)">234</span>&deg;</label>
<input id="h-ref" type="range" min="0" max="360" value="234">

</div>

<canvas id="gamut-canvas" width="440" height="440"></canvas>

</div>
<div class="gamut-panel">
<div style="margin-bottom:10px;display:flex;align-items:center;justify-content:space-between">
<span style="font-size:13px;color:var(--fg-2);font-weight:600">锚点 <span id="anchor-count" style="font-family:var(--mono)">0</span>/4</span><button class="btn-secondary" id="add-anchor-btn" style="font-size:11px;padding:4px 10px;display:none">+ 添加锚点</button>
<span style="display:flex;gap:8px"><button class="lock-btn" id="lock-anchors"><i data-lucide="lock" style="width:12px;height:12px"></i> 锁定</button><button class="btn-secondary" id="clear-anchors" style="font-size:11px;padding:4px 10px">清除全部</button></span>
</div>
<div class="anchor-list" id="anchor-list"><div style="padding:20px;text-align:center;color:var(--meta);font-size:13px">点击左侧色盘放置锚点</div></div>
<div class="picked-block">
<h3>取色结果</h3>
<div id="gm-anchor-colors"><div style="font-size:12px;color:var(--meta);padding:4px 0">放置锚点以查看色域</div></div>
<div id="gm-sample" style="display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
<div style="font-size:11px;color:var(--meta);margin-bottom:4px">取样</div>
<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
<div class="picked-swatch" id="gm-swatch" style="background:rgb(128,128,128)"></div>
<div>
<div style="font-family:var(--mono);font-size:14px;color:var(--fg-2)" id="gm-hex">#808080</div>
<div style="font-size:11px;color:var(--meta);margin-top:2px">R <span id="gm-r">128</span> G <span id="gm-g">128</span> B <span id="gm-b">128</span></div>
</div>
</div>
</div>
<button class="go-mix-btn" id="go-mix-gamut"><i data-lucide="flask-conical" style="width:14px;height:14px"></i> 去混色</button>
</div>
</div>
</div>
</div>

<script>
var baseH=234,scheme='complementary';
var c=document.getElementById('wheel'),ctx=c.getContext('2d');
var cx=170,cy=170,r=150;
function drawWheel(){
var img=ctx.createImageData(340,340);
for(var y=0;y<340;y++)for(var x=0;x<340;x++){
var dx=x-cx,dy=y-cy,dist=Math.sqrt(dx*dx+dy*dy);
if(dist<=r+2&&dist>=r-18){
var ang=Math.atan2(dy,dx)*180/Math.PI;
if(ang<0)ang+=360;
var rgb=hsv2rgb(ang,100,100);
var i=(y*340+x)*4;img.data[i]=rgb[0];img.data[i+1]=rgb[1];img.data[i+2]=rgb[2];img.data[i+3]=255;
}
}
ctx.putImageData(img,0,0);
var pts=getSchemeHues(baseH);
pts.forEach(function(h){
var rad=h*Math.PI/180;
var mx=cx+Math.cos(rad)*r, my=cy+Math.sin(rad)*r;
ctx.beginPath();ctx.arc(mx,my,8,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#1e1f22';ctx.lineWidth=2;ctx.stroke();
});
var rad=baseH*Math.PI/180;
var c2=hsv2rgb(baseH,100,100);
ctx.beginPath();ctx.arc(cx+Math.cos(rad)*(r-30),cy+Math.sin(rad)*(r-30),20,0,Math.PI*2);
ctx.fillStyle='rgb('+c2[0]+','+c2[1]+','+c2[2]+')';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
}
function getSchemeHues(h){
switch(scheme){
case'complementary':return[h,(h+180)%360];
case'triadic':return[h,(h+120)%360,(h+240)%360];
case'tetradic':return[h,(h+90)%360,(h+180)%360,(h+270)%360];
case'analogous':return[h,(h+30)%360,(h+60)%360,(h+330)%360,(h+300)%360];
case'split':return[h,(h+150)%360,(h+210)%360];
default:return[h,(h+180)%360];
}
}
function renderSwatches(){
var pts=getSchemeHues(baseH),names=['Base','Complement','Triad 1','Tetrad 2','Analog +1'];
document.getElementById('swatches').innerHTML=pts.map(function(h,i){
var rgb=hsv2rgb(h,80,75);
var hex='#'+((1<<24)|(rgb[0]<<16)|(rgb[1]<<8)|rgb[2]).toString(16).slice(1).toUpperCase();
return'<div class="swatch-row"><div class="dot" style="background:'+hex+'"></div><div class="info"><div class="label">'+(names[i]||'Color '+(i+1))+'</div><div class="hex">'+hex+'</div><div class="vals">H:'+Math.round(h)+'&deg; S:80% B:75% &middot; RGB('+rgb[0]+','+rgb[1]+','+rgb[2]+')</div></div></div>';
}).join('');
}
function hexFromRgb(r,g,b){return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1).toUpperCase()}
function rgbFromHex(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function syncFromHue(h){
baseH=h;
var rgb=hsv2rgb(h,80,75);
var hex=hexFromRgb(rgb[0],rgb[1],rgb[2]);
document.getElementById('h-ref').value=Math.round(h);
document.getElementById('cw-h-val').textContent=Math.round(h);
document.getElementById('hex-ref').value=hex;
document.getElementById('cw-swatch').style.background='rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')';
document.getElementById('cw-native').value=hex;
document.getElementById('cw-r').value=rgb[0];
document.getElementById('cw-g').value=rgb[1];
document.getElementById('cw-b').value=rgb[2];
drawWheel();renderSwatches();
}
function syncFromRgb(r,g,b){
var hh=rgb2hsv(r,g,b)[0];
var hex=hexFromRgb(r,g,b);
baseH=hh;
document.getElementById('h-ref').value=Math.round(hh);
document.getElementById('cw-h-val').textContent=Math.round(hh);
document.getElementById('hex-ref').value=hex;
document.getElementById('cw-swatch').style.background='rgb('+r+','+g+','+b+')';
document.getElementById('cw-native').value=hex;
drawWheel();renderSwatches();
}
var wheelDragging=false;
function pickHue(e){
var rct=c.getBoundingClientRect();
var dx=e.clientX-rct.left-cx, dy=e.clientY-rct.top-cy;
var ang=Math.atan2(dy,dx)*180/Math.PI;
if(ang<0)ang+=360;
syncFromHue(ang);
}
c.addEventListener('mousedown',function(e){e.preventDefault();wheelDragging=true;c.classList.add('dragging');pickHue(e)});
window.addEventListener('mousemove',function(e){if(wheelDragging)pickHue(e)});
window.addEventListener('mouseup',function(){wheelDragging=false;c.classList.remove('dragging')});
c.addEventListener('touchstart',function(e){e.preventDefault();wheelDragging=true;pickHue(e.touches[0])},{passive:false});
c.addEventListener('touchmove',function(e){e.preventDefault();if(wheelDragging)pickHue(e.touches[0])},{passive:false});
c.addEventListener('touchend',function(){wheelDragging=false});
document.querySelectorAll('.scheme-btn').forEach(function(b){b.addEventListener('click',function(){
document.querySelectorAll('.scheme-btn').forEach(function(x){x.classList.remove('active')});
b.classList.add('active');
scheme=b.dataset.scheme;
drawWheel();renderSwatches();
})});
document.getElementById('h-ref').addEventListener('input',function(e){syncFromHue(parseFloat(e.target.value))});
['cw-r','cw-g','cw-b'].forEach(function(id){
document.getElementById(id).addEventListener('input',function(){
var rv=Math.min(255,Math.max(0,+document.getElementById('cw-r').value||0));
var gv=Math.min(255,Math.max(0,+document.getElementById('cw-g').value||0));
var bv=Math.min(255,Math.max(0,+document.getElementById('cw-b').value||0));
syncFromRgb(rv,gv,bv);
});
});
document.getElementById('cw-native').addEventListener('input',function(){
var rgb=rgbFromHex(this.value);
document.getElementById('cw-r').value=rgb[0];
document.getElementById('cw-g').value=rgb[1];
document.getElementById('cw-b').value=rgb[2];
syncFromRgb(rgb[0],rgb[1],rgb[2]);
});
document.getElementById('hex-ref').addEventListener('input',function(e){
var v=e.target.value;
if(/^#[0-9a-fA-F]{6}$/.test(v)){
var rgb=rgbFromHex(v);
document.getElementById('cw-r').value=rgb[0];
document.getElementById('cw-g').value=rgb[1];
document.getElementById('cw-b').value=rgb[2];
syncFromRgb(rgb[0],rgb[1],rgb[2]);
}
});
function hsv2rgb(h,s,v){h/=360;s/=100;v/=100;var i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s),rr,gg,bb;switch(i%6){case 0:rr=v;gg=t;bb=p;break;case 1:rr=q;gg=v;bb=p;break;case 2:rr=p;gg=v;bb=t;break;case 3:rr=p;gg=q;bb=v;break;case 4:rr=t;gg=p;bb=v;break;case 5:rr=v;gg=p;bb=q;break}return[Math.round(rr*255),Math.round(gg*255),Math.round(bb*255)]}
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0,s=mx===0?0:d/mx,v=mx;if(d!==0){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,s*100,v*100]}

// ---- GAMUT: circular polar HS disc ----
var gm=document.getElementById('gamut-canvas'),gmCtx=gm.getContext('2d');
var gW=440,gH=440,gcx=220,gcy=220,grad=200;
var anchors=[],MAX_A=4,dragIdx=-1,mdPos=null,discCache=null,gamutLocked=false;

function buildDisc(){
discCache=gmCtx.createImageData(gW,gH);
for(var y=0;y<gH;y++)for(var x=0;x<gW;x++){
var dx=x-gcx,dy=y-gcy,dist=Math.sqrt(dx*dx+dy*dy);
var i=(y*gW+x)*4;
if(dist<=grad){
var ang=Math.atan2(-dy,dx)*180/Math.PI;if(ang<0)ang+=360;
var sat=(dist/grad)*100;
var v=50+35*(dist/grad);
var rgb=hsv2rgb(ang,sat,v);
discCache.data[i]=rgb[0];discCache.data[i+1]=rgb[1];discCache.data[i+2]=rgb[2];discCache.data[i+3]=255;
}else{discCache.data[i]=49;discCache.data[i+1]=51;discCache.data[i+2]=56;discCache.data[i+3]=255;}
}
}
var storageOk=false;
(function(){try{localStorage.setItem('od:gamut:test','1');localStorage.removeItem('od:gamut:test');storageOk=true;}catch(e){}})();
// window.name persists across navigations within the same tab — immune to iframe sandbox
function winStore(){try{var d=window.name?JSON.parse(window.name):{};for(var i=0;i<arguments.length;i+=2)d[arguments[i]]=arguments[i+1];window.name=JSON.stringify(d)}catch(e){}}
function winLoad(k){try{return JSON.parse(window.name||'{}')[k]}catch(e){return null}}
function saveGamutState(){
  var aj=JSON.stringify(anchors), lk=gamutLocked?'1':'0';
  winStore('od:gamut:anchors',aj,'od:gamut:locked',lk);
  if(!storageOk)return;
  try{localStorage.setItem('od:gamut:anchors',aj);localStorage.setItem('od:gamut:locked',lk)}catch(e){storageOk=false}
}
function loadGamutState(){
  var raw=winLoad('od:gamut:anchors');
  if(!raw&&storageOk){try{raw=localStorage.getItem('od:gamut:anchors')}catch(e){storageOk=false}}
  if(raw){try{var a=JSON.parse(raw);if(Array.isArray(a)&&a.length<=MAX_A)anchors=a}catch(e){}}
  var lk=winLoad('od:gamut:locked');
  if(!lk&&storageOk){try{lk=localStorage.getItem('od:gamut:locked')}catch(e){storageOk=false}}
  gamutLocked=lk==='1';
}
function applyLockUI(){var btn=document.getElementById('lock-anchors');if(gamutLocked){btn.classList.add('locked');btn.innerHTML='<i data-lucide="lock" style="width:12px;height:12px"></i> 已锁定';}else{btn.classList.remove('locked');btn.innerHTML='<i data-lucide="lock" style="width:12px;height:12px"></i> 锁定';}lucide.createIcons();var hint=document.querySelector('.gamut-hint');if(hint)hint.textContent=gamutLocked?'锁定模式：点击色盘任意位置取色 · 锚点位置已固定':'解锁模式：点击放置/删除锚点 · 拖动移动 | 锁定后：点击色盘任意位置取色';}



function renderGamut(){
if(!discCache)buildDisc();
gmCtx.putImageData(discCache,0,0);
if(anchors.length>=3){
gmCtx.save();gmCtx.beginPath();
gmCtx.moveTo(anchors[0].x,anchors[0].y);
for(var k=1;k<anchors.length;k++)gmCtx.lineTo(anchors[k].x,anchors[k].y);
gmCtx.closePath();
gmCtx.strokeStyle='rgba(255,255,255,0.6)';gmCtx.lineWidth=2;gmCtx.setLineDash([6,3]);gmCtx.stroke();
gmCtx.setLineDash([]);gmCtx.restore();
}else if(anchors.length===2){
gmCtx.beginPath();gmCtx.moveTo(anchors[0].x,anchors[0].y);gmCtx.lineTo(anchors[1].x,anchors[1].y);
gmCtx.strokeStyle='rgba(255,255,255,0.5)';gmCtx.lineWidth=2;gmCtx.setLineDash([6,3]);gmCtx.stroke();
gmCtx.setLineDash([]);
}
anchors.forEach(function(a,i){
gmCtx.beginPath();gmCtx.arc(a.x,a.y,9,0,Math.PI*2);
gmCtx.fillStyle='#fff';gmCtx.fill();
gmCtx.strokeStyle=i===dragIdx?'#5865f2':'#1e1f22';gmCtx.lineWidth=2.5;gmCtx.stroke();
gmCtx.fillStyle='#1e1f22';gmCtx.font='bold 10px monospace';gmCtx.textAlign='center';gmCtx.textBaseline='middle';
gmCtx.fillText(i+1,a.x,a.y);
});
}

function getDiscColor(ex,ey){
var px=Math.round(ex),py=Math.round(ey);
var i=(py*gW+px)*4;
return[discCache.data[i],discCache.data[i+1],discCache.data[i+2]];
}

function updateAnchorList(){
document.getElementById('anchor-count').textContent=anchors.length;
var ct=document.getElementById('anchor-list');
if(anchors.length===0){ct.innerHTML='<div style="padding:20px;text-align:center;color:var(--meta);font-size:13px">点击左侧色盘放置锚点</div>';return;}
ct.innerHTML=anchors.map(function(a,i){
var px=Math.round(a.x),py=Math.round(a.y);
var k=(py*gW+px)*4;
var rgb=[discCache.data[k],discCache.data[k+1],discCache.data[k+2]];
var hex=hexFromRgb(rgb[0],rgb[1],rgb[2]);
var hsv=rgb2hsv(rgb[0],rgb[1],rgb[2]);
return'<div class="anchor-item"><div class="a-dot" style="background:'+hex+'"></div><div class="a-info"><div class="a-hex">'+hex+'</div><div class="a-hs">H:'+Math.round(hsv[0])+'&deg; S:'+Math.round(hsv[1])+'%</div></div><button class="a-del" data-idx="'+i+'" title="Delete">&times;</button></div>';
}).join('');
ct.querySelectorAll('.a-del').forEach(function(btn){btn.addEventListener('click',function(e){e.stopPropagation();var idx=parseInt(this.dataset.idx);anchors.splice(idx,1);renderGamut();updateAnchorList();saveGamutState();})});
updatePicked();
}

function gmGoMix(r,g,b){location.href='mix.html?r='+r+'&g='+g+'&b='+b;}
function updatePicked(sampleRgb){
var ct=document.getElementById('gm-anchor-colors');
if(anchors.length===0){ct.innerHTML='<div style="font-size:12px;color:var(--meta);padding:4px 0">放置锚点以查看色域</div>';}
else{ct.innerHTML='<div style="font-size:11px;color:var(--meta);margin-bottom:6px">锚点色域</div>'+anchors.map(function(a,i){
var px=Math.round(a.x),py=Math.round(a.y);
var k=(py*gW+px)*4;
var rgb=[discCache.data[k],discCache.data[k+1],discCache.data[k+2]];
var hex=hexFromRgb(rgb[0],rgb[1],rgb[2]);
return'<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><div style="width:22px;height:22px;border-radius:50%;background:'+hex+';border:1px solid var(--border-soft);flex-shrink:0"></div><div style="flex:1;min-width:0"><span style="font-size:12px;font-family:var(--mono);color:var(--fg-2)">'+(i+1)+'. '+hex+'</span><span style="font-size:11px;color:var(--meta);margin-left:6px">RGB('+rgb[0]+','+rgb[1]+','+rgb[2]+')</span></div><button onclick="gmGoMix('+rgb[0]+','+rgb[1]+','+rgb[2]+')" style="flex-shrink:0;width:24px;height:24px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-on);cursor:pointer;display:grid;place-items:center;transition:.15s" title="去混色"><i data-lucide="flask-conical" style="width:12px;height:12px"></i></button></div>';
}).join('');}
var sd=document.getElementById('gm-sample');
if(sampleRgb){
var hex=hexFromRgb(sampleRgb[0],sampleRgb[1],sampleRgb[2]);
document.getElementById('gm-swatch').style.background='rgb('+sampleRgb[0]+','+sampleRgb[1]+','+sampleRgb[2]+')';
document.getElementById('gm-hex').textContent=hex;
document.getElementById('gm-r').textContent=sampleRgb[0];
document.getElementById('gm-g').textContent=sampleRgb[1];
document.getElementById('gm-b').textContent=sampleRgb[2];
sd.style.display='block';
}else{sd.style.display='none';}
lucide.createIcons();
}

gm.addEventListener('mousedown',function(e){
var rct=gm.getBoundingClientRect();
var ex=e.clientX-rct.left, ey=e.clientY-rct.top;
mdPos={x:ex,y:ey};
for(var i=0;i<anchors.length;i++){var dx=ex-anchors[i].x,dy=ey-anchors[i].y;if(Math.sqrt(dx*dx+dy*dy)<14){dragIdx=i;e.preventDefault();return;}}
dragIdx=-1;
});

window.addEventListener('mousemove',function(e){
if(dragIdx<0)return;
var rct=gm.getBoundingClientRect();
var ex=e.clientX-rct.left, ey=e.clientY-rct.top;
var dx=ex-gcx,dy=ey-gcy,dist=Math.sqrt(dx*dx+dy*dy);
if(dist>grad-4){var ang=Math.atan2(dy,dx);ex=gcx+Math.cos(ang)*(grad-4);ey=gcy+Math.sin(ang)*(grad-4);}
anchors[dragIdx]={x:ex,y:ey};mdPos=null;
renderGamut();updateAnchorList();
});

window.addEventListener('mouseup',function(e){
if(dragIdx>=0){dragIdx=-1;saveGamutState();return;}
if(!mdPos)return;
var rct=gm.getBoundingClientRect();
var ux=e.clientX-rct.left, uy=e.clientY-rct.top;
var dx=mdPos.x-ux,dy=mdPos.y-uy;
if(Math.sqrt(dx*dx+dy*dy)>5){mdPos=null;return;}
mdPos=null;
var ex=ux,ey=uy;
var dd=Math.sqrt((ex-gcx)*(ex-gcx)+(ey-gcy)*(ey-gcy));
if(dd>grad)return;
if(gamutLocked){updatePicked(getDiscColor(ex,ey));return;}
for(var i=0;i<anchors.length;i++){var ax=ex-anchors[i].x,ay=ey-anchors[i].y;if(Math.sqrt(ax*ax+ay*ay)<14){anchors.splice(i,1);renderGamut();updateAnchorList();saveGamutState();return;}}
if(anchors.length<MAX_A){anchors.push({x:ex,y:ey});renderGamut();updateAnchorList();saveGamutState();}
});

// Touch support
gm.addEventListener('touchstart',function(e){
e.preventDefault();
var rct=gm.getBoundingClientRect();
var ex=e.touches[0].clientX-rct.left, ey=e.touches[0].clientY-rct.top;
mdPos={x:ex,y:ey};
for(var i=0;i<anchors.length;i++){var dx=ex-anchors[i].x,dy=ey-anchors[i].y;if(Math.sqrt(dx*dx+dy*dy)<18){dragIdx=i;return;}}
dragIdx=-1;
},{passive:false});

gm.addEventListener('touchmove',function(e){
e.preventDefault();
if(dragIdx<0)return;
var rct=gm.getBoundingClientRect();
var ex=e.touches[0].clientX-rct.left, ey=e.touches[0].clientY-rct.top;
var dx=ex-gcx,dy=ey-gcy,dist=Math.sqrt(dx*dx+dy*dy);
if(dist>grad-4){var ang=Math.atan2(dy,dx);ex=gcx+Math.cos(ang)*(grad-4);ey=gcy+Math.sin(ang)*(grad-4);}
anchors[dragIdx]={x:ex,y:ey};mdPos=null;
renderGamut();updateAnchorList();
},{passive:false});

gm.addEventListener('touchend',function(e){
if(dragIdx>=0){dragIdx=-1;saveGamutState();return;}
if(!mdPos)return;
var ex=mdPos.x, ey=mdPos.y;mdPos=null;
var dd=Math.sqrt((ex-gcx)*(ex-gcx)+(ey-gcy)*(ey-gcy));
if(dd>grad)return;
if(gamutLocked){updatePicked(getDiscColor(ex,ey));return;}
for(var i=0;i<anchors.length;i++){var ax=ex-anchors[i].x,ay=ey-anchors[i].y;if(Math.sqrt(ax*ax+ay*ay)<18){anchors.splice(i,1);renderGamut();updateAnchorList();saveGamutState();return;}}
if(anchors.length<MAX_A){anchors.push({x:ex,y:ey});renderGamut();updateAnchorList();saveGamutState();}
});

document.getElementById('clear-anchors').addEventListener('click',function(){anchors=[];renderGamut();updateAnchorList();updatePicked();saveGamutState()});

document.getElementById('lock-anchors').addEventListener('click',function(){
gamutLocked=!gamutLocked;
var btn=this;
if(gamutLocked){btn.classList.add('locked');btn.innerHTML='<i data-lucide="lock" style="width:12px;height:12px"></i> 已锁定';}
else{btn.classList.remove('locked');btn.innerHTML='<i data-lucide="lock" style="width:12px;height:12px"></i> 锁定';}
lucide.createIcons();
var hint=document.querySelector('.gamut-hint');if(hint)hint.textContent=gamutLocked?'锁定模式：点击色盘任意位置取色 · 锚点位置已固定':'解锁模式：点击放置/删除锚点 · 拖动移动 | 锁定后：点击色盘任意位置取色';
saveGamutState();
});
	document.getElementById('add-anchor-btn').addEventListener('click',function(){
	if(anchors.length<MAX_A){anchors.push({x:gcx,y:gcy});renderGamut();updateAnchorList();saveGamutState();}
	});

document.getElementById('go-mix-gamut').addEventListener('click',function(){
var r=document.getElementById('gm-r').textContent;
var g=document.getElementById('gm-g').textContent;
var b=document.getElementById('gm-b').textContent;
location.href='mix.html?r='+r+'&g='+g+'&b='+b;
});

document.querySelectorAll('.tab-btn').forEach(function(btn){
btn.addEventListener('click',function(){
document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
btn.classList.add('active');
var tab=btn.dataset.tab;
document.getElementById('tab-wheel').style.display=tab==='wheel'?'block':'none';
document.getElementById('tab-gamut').style.display=tab==='gamut'?'block':'none';
});
});

// Init
drawWheel();renderSwatches();
loadGamutState();buildDisc();renderGamut();updateAnchorList();applyLockUI();

document.getElementById('go-mix-btn').addEventListener('click',function(){
var r=document.getElementById('cw-r').value;
var g=document.getElementById('cw-g').value;
var b=document.getElementById('cw-b').value;
location.href='mix.html?r='+r+'&g='+g+'&b='+b;
});

lucide.createIcons();
</script>
</body>
