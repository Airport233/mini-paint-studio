<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漆料库 — HobbyMix</title>
<style>
  :root {
    --bg:           #313338;
    --surface:      #2b2d31;
    --surface-warm: #1e1f22;
    --fg:           #dbdee1;
    --fg-2:         #f2f3f5;
    --muted:        #949ba4;
    --meta:         #80848e;
    --border:       rgba(255, 255, 255, 0.06);
    --border-solid: #3f4147;
    --accent:       #5865f2;
    --accent-hover: #4752c4;
    --danger:       #f23f43;
    --success:      #23a55a;
    --radius-sm:    4px;
    --radius-md:    8px;
    --font:         "gg sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono:         "gg mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    display: flex;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  nav {
    width: 240px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 16px 8px;
  }
  nav .brand { font-size: 16px; font-weight: 700; color: var(--fg-2); padding: 0 8px 20px; }
  nav .brand span { color: var(--accent); }
  nav a {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: var(--radius-sm);
    color: var(--meta); text-decoration: none;
    font-size: 15px; font-weight: 500;
    transition: background 0.15s, color 0.15s;
    margin-bottom: 2px;
  }
  nav a .nav-icon { width: 18px; height: 18px; flex-shrink: 0; }
  nav a:hover, nav a.active { background: rgba(78,80,88,0.3); color: var(--fg); }
  nav a.active { background: rgba(78,80,88,0.6); }

  main { flex: 1; overflow-y: auto; padding: 32px 40px; }
  h1 { font-size: 24px; font-weight: 700; color: var(--fg-2); margin-bottom: 8px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; flex-wrap: nowrap; }
  .chip-scroll { flex: 1; min-width: 0; overflow-x: auto; display: flex; gap: 8px; align-items: center; white-space: nowrap; scrollbar-width: thin; scrollbar-color: var(--border-solid) transparent; }
  .chip-scroll::-webkit-scrollbar { height: 4px; }
  .chip-scroll::-webkit-scrollbar-track { background: transparent; }
  .chip-scroll::-webkit-scrollbar-thumb { background: var(--border-solid); border-radius: 4px; }
  .chip-scroll .chip { flex-shrink: 0; }
  .search {
    flex: 1; min-width: 200px; max-width: 360px;
    background: var(--surface-warm); border: 1px solid var(--border-solid);
    border-radius: var(--radius-sm); padding: 10px 14px;
    color: var(--fg); font-size: 14px; outline: none; font-family: inherit;
  }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--meta); }

  .chip {
    padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--border-solid);
    background: transparent; color: var(--muted); transition: 0.15s;
    user-select: none;
  }
  .chip:hover, .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .btn {
    padding: 10px 18px; border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background 0.15s; border: none; font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--surface); border-radius: var(--radius-md);
    border: 1px solid var(--border); overflow: hidden;
    cursor: pointer; transition: border-color 0.2s, transform 0.2s;
  }
  .card:hover { border-color: var(--border-solid); transform: translateY(-2px); }
  .card .swatch {
    height: 100px; position: relative;
    display: flex; align-items: flex-end; padding: 12px;
  }
  .card .swatch .brand-tag {
    position: absolute; top: 10px; right: 10px;
    background: rgba(0,0,0,0.45); color: #fff;
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
  }
  .card .info { padding: 12px 14px; }
  .card .name { font-size: 14px; font-weight: 600; color: var(--fg-2); margin-bottom: 4px; }
  .card .meta-row { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .card .hex { font-family: var(--mono); color: var(--fg); }
  .card .del-btn {
    position: absolute; top: 6px; right: 6px;
    width: 28px; height: 28px; border-radius: var(--radius-sm);
    background: rgba(0,0,0,0.5); border: none; cursor: pointer;
    color: var(--muted); display: none; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s; z-index: 2;
  }
  .card:hover .del-btn { display: flex; }
  .card .del-btn:hover { background: var(--danger); color: #fff; }

  .confirm-body { text-align: center; padding: 16px 0; }
  .confirm-body .paint-name { font-size: 16px; font-weight: 600; color: var(--fg-2); margin-bottom: 4px; }
  .confirm-body .paint-meta { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .confirm-body .paint-swatch-confirm { width: 64px; height: 64px; border-radius: var(--radius-sm); margin: 0 auto 8px; border: 1px solid var(--border); }
  .confirm-body .warn { font-size: 13px; color: var(--danger); margin-top: 12px; }

  .empty {
    text-align: center; padding: 80px 20px; color: var(--muted);
    display: none;
  }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }
  .icon .nav-icon, .card .icon .nav-icon { width: 32px; height: 32px; }
  .empty .icon .nav-icon { width: 48px; height: 48px; }
  .empty p { font-size: 15px; max-width: 360px; margin: 0 auto 8px; }
  .empty .hint { font-size: 13px; color: var(--meta); }

  /* Modal overlay */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; justify-content: center; align-items: center; z-index: 100;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: var(--radius-md);
    width: 520px; max-width: 95vw; max-height: 85vh;
    overflow-y: auto; padding: 28px;
  }
  .modal h2 { font-size: 20px; font-weight: 700; color: var(--fg-2); margin-bottom: 20px; }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);
    background: var(--surface-warm); border: 1px solid var(--border-solid);
    color: var(--fg); font-size: 14px; outline: none; font-family: inherit;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }
  .color-preview {
    width: 100%; height: 64px; border-radius: var(--radius-sm);
    margin-bottom: 16px; border: 1px solid var(--border);
  }

  /* ── Color picker: swatch + R/G/B ── */
  .cp-row { display: flex; align-items: center; gap: 10px; }
  .cp-swatch {
    width: 44px; height: 44px; border-radius: var(--radius-sm);
    cursor: pointer; border: 2px solid var(--border-solid);
    flex-shrink: 0; transition: border-color 0.15s;
  }
  .cp-swatch:hover { border-color: var(--fg); }
  .cp-rgb { display: flex; gap: 6px; flex: 1; }
  .cp-field { flex: 1; min-width: 0; }
  .cp-field label {
    display: block; font-size: 10px; font-weight: 600;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.04em; margin-bottom: 2px;
  }
  .cp-field input {
    width: 100%; padding: 6px; border-radius: var(--radius-sm);
    background: var(--surface-warm); border: 1px solid var(--border-solid);
    color: var(--fg); font-size: 13px; font-family: var(--mono);
    text-align: center; outline: none;
  }
  .cp-field input:focus { border-color: var(--accent); }
  .cp-field input[type=number]::-webkit-inner-spin-button,
  .cp-field input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .cp-field input[type=number] { -moz-appearance: textfield; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
  .btn-secondary { background: #4e5058; color: #fff; }
  .btn-secondary:hover { background: #6d6f78; }

  .picker-area { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 12px; }
  .picker-area canvas { border-radius: var(--radius-sm); cursor: crosshair; flex-shrink: 0; }
  .picker-col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .picker-col .circle {
    width: 56px; height: 56px; border-radius: 50%;
    border: 2px solid var(--border-solid);
  }
  .picker-col .hex-val { font-family: var(--mono); font-size: 13px; color: var(--fg); }

  .drop-zone {
    border: 2px dashed var(--border-solid);
    border-radius: var(--radius-md);
    padding: 36px 24px; text-align: center; cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent); background: rgba(88,101,242,0.06);
  }
  .drop-zone p { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .color-canvas {
    width: 100%; max-height: 280px; object-fit: contain;
    border-radius: var(--radius-sm); border: 1px solid var(--border-solid);
    cursor: crosshair; display: block;
  }
  .sample-result {
    margin-top: 14px; padding: 12px 14px;
    background: var(--surface-warm); border-radius: var(--radius-sm);
    border: 1px solid var(--border); display: flex; align-items: center; gap: 12px;
  }
  .sample-result .label-text {
    font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap;
  }
  .img-clear-btn {
    margin-top: 6px; font-size: 12px; color: var(--muted);
    background: none; border: none; cursor: pointer; font-family: inherit;
    text-decoration: underline; padding: 0;
  }
  .img-clear-btn:hover { color: var(--danger); }
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth-guard.js"></script>
</head>
<body>

<nav>
  <div class="brand"><i data-lucide="palette" class="nav-icon"></i> <span>Hobby</span>Mix</div>
  <a href="/"><i data-lucide="home" class="nav-icon"></i> 首页</a>
  <a href="/paints" class="active"><i data-lucide="palette" class="nav-icon"></i> 漆料库</a>
  <a href="/mix"><i data-lucide="flask-conical" class="nav-icon"></i> 调色引擎</a>
  <a href="/color-wheel"><i data-lucide="palette" class="nav-icon"></i> 色彩工具</a>
  <a href="/preview"><i data-lucide="box" class="nav-icon"></i> 3D 预览</a>
  <a href="/recipes"><i data-lucide="clipboard-list" class="nav-icon"></i> 配方库</a>
  <a href="/presets"><i data-lucide="lightbulb" class="nav-icon"></i> 灯光预设</a>
</nav>

<main>
  <h1>漆料库</h1>
  <p class="subtitle">管理你手头所有漆料 — 拍照取色，录入真实颜色</p>

  <div class="toolbar">
    <input class="search" placeholder="搜索名称、品牌、色号…" id="search">
    <div class="chip-scroll" id="chip-scroll">
      <span class="chip active" data-filter="all">全部</span>
      <span class="chip" data-filter="GW">GW</span>
      <span class="chip" data-filter="AV">AV</span>
      <span class="chip" data-filter="AK">AK</span>
      <span class="chip" data-filter="Tamiya">田宫</span>
      <span class="chip" data-filter="Gaia">盖亚</span>
      <span class="chip" data-filter="Scale75">Scale75</span>
      <span class="chip" data-filter="ArmyPainter">Army Painter</span>
      <span class="chip" data-filter="Other">其他</span>
    </div>
    <button class="btn btn-primary" onclick="openModal()">+ 添加漆料</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">
    <div class="icon"><i data-lucide="palette" class="nav-icon"></i></div>
    <p>还没有录入漆料，点击"添加漆料"开始</p>
    <p class="hint">上传漆料照片，点击取色即可录入真实颜色</p>
  </div>
</main>

<!-- Add Paint Modal -->
<div class="overlay" id="modal-overlay">
  <div class="modal">
    <h2>添加漆料</h2>
    <div class="field">
      <label>漆料名称</label>
      <input id="mf-name" placeholder="例如：郡士 C004 黄色">
    </div>
    <div class="field-row">
      <div class="field">
        <label>品牌</label>
        <select id="mf-brand">
          <option value="GW">Games Workshop</option>
          <option value="AV">Vallejo</option>
          <option value="AK">AK Interactive</option>
          <option value="Tamiya">田宫 Tamiya</option>
          <option value="Gaia">盖亚 Gaia</option>
          <option value="Scale75">Scale75</option>
          <option value="ArmyPainter">Army Painter</option>
          <option value="Other">其他</option>
        </select>
      </div>
      <div class="field">
        <label>色号</label>
        <input id="mf-code" placeholder="C004 / 70.950">
      </div>
    </div>
    <div class="field">
      <label>颜色 — 拍照取色</label>
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('img-upload').click()">
        <input type="file" accept="image/jpeg,image/png,image/webp" id="img-upload" hidden>
        <i data-lucide="image" style="width:32px;height:32px;color:var(--meta)"></i>
        <p>点击上传或拖拽漆料照片到此处</p>
      </div>
      <canvas class="color-canvas" id="img-canvas" style="display:none"></canvas>
    </div>
    <div class="sample-result" id="sample-result" style="display:none">
      <span class="label-text">取色结果</span>
      <div class="cp-swatch" id="mf-swatch" style="background:rgb(42,44,47)"></div>
      <div class="cp-rgb">
        <div class="cp-field"><label>R</label><input type="number" min="0" max="255" value="-" id="mf-r" readonly></div>
        <div class="cp-field"><label>G</label><input type="number" min="0" max="255" value="-" id="mf-g" readonly></div>
        <div class="cp-field"><label>B</label><input type="number" min="0" max="255" value="-" id="mf-b" readonly></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="addPaint()">添加</button>
    </div>
  </div>
</div>

<!-- Delete confirmation modal -->
<div class="overlay" id="del-overlay">
  <div class="modal" style="width:420px">
    <h2>确认删除</h2>
    <div class="confirm-body">
      <div class="paint-swatch-confirm" id="del-swatch"></div>
      <div class="paint-name" id="del-name"></div>
      <div class="paint-meta" id="del-meta"></div>
      <p class="warn">此操作不可撤销，删除后无法恢复</p>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeDelConfirm()">取消</button>
      <button class="btn btn-primary" style="background:var(--danger)" onclick="confirmDelete()">确认删除</button>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/auth-guard.js"></script>
<script>
  requireAuth();

  var paints = [];
  var filter = 'all';

  function loadPaints() {
    var params = filter !== 'all' ? { brand: filter } : {};
    getPaints(params).then(function(data) {
      paints = data;
      render();
    }).catch(function() {
      paints = [];
      render();
    });
  }

  function render() {
    var q = (document.getElementById('search').value || '').toLowerCase();
    var filtered = paints.filter(function(p) {
      if (q && p.name.toLowerCase().indexOf(q) === -1 && p.brand.toLowerCase().indexOf(q) === -1 && p.code.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    document.getElementById('grid').innerHTML = filtered.map(function(p) {
      var hex = '#' + [p.r, p.g, p.b].map(function(c) { return c.toString(16).padStart(2, '0'); }).join('');
      return '<div class="card">'
        + '<button class="del-btn" onclick="event.stopPropagation();openDelConfirm(\'' + p.id + '\')" title="删除"><i data-lucide="trash-2" style="width:14px;height:14px"></i></button>'
        + '<div class="swatch" style="background:' + hex + '"><span class="brand-tag">' + p.brand + '</span></div>'
        + '<div class="info"><div class="name">' + p.name + '</div>'
        + '<div class="meta-row"><span class="hex">' + hex + '</span><span>' + p.code + '</span></div></div></div>';
    }).join('');
    document.getElementById('empty').style.display = filtered.length ? 'none' : 'block';
    setTimeout(function(){ lucide.createIcons(); }, 10);
  }

  document.getElementById('search').addEventListener('input', render);
  document.querySelectorAll('.chip-scroll .chip').forEach(function(c) {
    c.addEventListener('click', function() {
      document.querySelectorAll('.chip').forEach(function(x) { x.classList.remove('active'); });
      c.classList.add('active');
      filter = c.dataset.filter;
      loadPaints();
    });
  });

  loadPaints();

  var pickedR = 128, pickedG = 128, pickedB = 128;

  function openModal() {
    document.getElementById('modal-overlay').style.display = 'flex';
    document.getElementById('mf-name').value = '';
    document.getElementById('mf-code').value = '';
    document.getElementById('mf-brand').value = 'GW';
    pickedR = pickedG = pickedB = 128;
    document.getElementById('mf-swatch').style.background = '#808080';
    document.getElementById('mf-r').value = '-';
    document.getElementById('mf-g').value = '-';
    document.getElementById('mf-b').value = '-';
    document.getElementById('drop-zone').style.display = 'block';
    document.getElementById('sample-result').style.display = 'none';
    document.getElementById('img-upload').disabled = false;
    document.getElementById('img-upload').value = '';
    var oldImg = document.getElementById('img-canvas');
    if (oldImg) oldImg.remove();
  }

  function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

  // Drag & Drop
  var dropZone = document.getElementById('drop-zone');
  dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-over'); });
  dropZone.addEventListener('drop', function(e) {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    var file = e.dataTransfer.files[0];
    if (file) document.getElementById('img-upload').files = e.dataTransfer.files;
    document.getElementById('img-upload').dispatchEvent(new Event('change'));
  });

  document.getElementById('img-upload').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var w = Math.min(img.width, 1920);
      var ratio = w / img.width;
      canvas.width = w; canvas.height = Math.round(img.height * ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.style.maxWidth = '100%';
      canvas.style.borderRadius = '8px';
      canvas.style.cursor = 'crosshair';
      canvas.id = 'img-canvas';
      canvas.addEventListener('click', function(ce) {
        var rect = canvas.getBoundingClientRect();
        var sx = Math.round((ce.offsetX / rect.width) * canvas.width);
        var sy = Math.round((ce.offsetY / rect.height) * canvas.height);
        var px = canvas.getContext('2d').getImageData(sx, sy, 1, 1).data;
        pickedR = px[0]; pickedG = px[1]; pickedB = px[2];
        document.getElementById('mf-swatch').style.background = 'rgb(' + pickedR + ',' + pickedG + ',' + pickedB + ')';
        document.getElementById('mf-r').value = pickedR;
        document.getElementById('mf-g').value = pickedG;
        document.getElementById('mf-b').value = pickedB;
        document.getElementById('sample-result').style.display = 'flex';
      });
      // Replace drop-zone with canvas
      var dz = document.getElementById('drop-zone');
      dz.style.display = 'none';
      dz.parentNode.insertBefore(canvas, dz.nextSibling);
      document.getElementById('img-upload').disabled = true;
    };
    img.src = URL.createObjectURL(file);
  });

  function addPaint() {
    var brand = document.getElementById('mf-brand').value;
    var code = document.getElementById('mf-code').value.trim();
    var name = document.getElementById('mf-name').value.trim();
    if (!code || !name) return;
    createPaint({ brand: brand, code: code, name: name, r: pickedR, g: pickedG, b: pickedB }).then(function() {
      filter = brand;
      document.querySelectorAll('.chip').forEach(function(x) { x.classList.remove('active'); });
      var chip = document.querySelector('.chip[data-filter="' + brand + '"]');
      if (chip) chip.classList.add('active');
      loadPaints();
      closeModal();
    }).catch(function(err) { alert('添加失败: ' + err.message); });
  }

  var deleteTargetId = null;

  function openDelConfirm(id) {
    deleteTargetId = id;
    var p = paints.find(function(x) { return x.id === id; });
    if (!p) return;
    var hex = '#' + [p.r, p.g, p.b].map(function(c) { return c.toString(16).padStart(2, '0'); }).join('');
    document.getElementById('del-swatch').style.background = hex;
    document.getElementById('del-name').textContent = p.name;
    document.getElementById('del-meta').textContent = p.brand + ' · ' + p.code;
    document.getElementById('del-overlay').style.display = 'flex';
  }

  function closeDelConfirm() { document.getElementById('del-overlay').style.display = 'none'; }

  function confirmDelete() {
    deletePaint(deleteTargetId).then(function() {
      closeDelConfirm();
      loadPaints();
    }).catch(function(err) { alert('删除失败: ' + err.message); });
  }

  document.getElementById('modal-overlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
  document.getElementById('del-overlay').addEventListener('click', function(e) { if (e.target === this) closeDelConfirm(); });
lucide.createIcons();
</script>
</body>
</html>
