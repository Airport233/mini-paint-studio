<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灯光预设 — HobbyMix</title>
<style>
  :root {
    --bg:           #313338;
    --surface:      #2b2d31;
    --surface-warm: #1e1f22;
    --fg:           #dbdee1;
    --fg-2:         #f2f3f5;
    --muted:        #949ba4;
    --meta:         #80848e;
    --border:       rgba(255, 255, 255, 0.06);
    --border-solid: #3f4147;
    --accent:       #5865f2;
    --accent-hover: #4752c4;
    --danger:       #f23f43;
    --radius-sm:    4px;
    --radius-md:    8px;
    --font:         "gg sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono:         "gg mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    display: flex;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  nav {
    width: 240px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 16px 8px;
  }
  nav .brand { font-size: 16px; font-weight: 700; color: var(--fg-2); padding: 0 8px 20px; display: flex; align-items: center; gap: 8px; }
  nav .brand span { color: var(--accent); }
  nav a {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: var(--radius-sm);
    color: var(--meta); text-decoration: none;
    font-size: 15px; font-weight: 500;
    transition: background 0.15s, color 0.15s;
    margin-bottom: 2px;
  }
  nav a .nav-icon { width: 18px; height: 18px; flex-shrink: 0; }
  nav a:hover, nav a.active { background: rgba(78,80,88,0.3); color: var(--fg); }
  nav a.active { background: rgba(78,80,88,0.6); }

  main { flex: 1; overflow-y: auto; padding: 32px 40px; }
  h1 { font-size: 24px; font-weight: 700; color: var(--fg-2); margin-bottom: 8px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
  .search {
    flex: 1; min-width: 200px; max-width: 360px;
    background: var(--surface-warm); border: 1px solid var(--border-solid);
    border-radius: var(--radius-sm); padding: 10px 14px;
    color: var(--fg); font-size: 14px; outline: none; font-family: inherit;
  }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--meta); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--surface); border-radius: var(--radius-md);
    border: 1px solid var(--border); padding: 16px;
    transition: border-color 0.2s, transform 0.2s;
  }
  .card:hover { border-color: var(--border-solid); transform: translateY(-2px); }

  .card-cover {
    width: 100%; height: 140px;
    background: var(--surface-warm);
    border-radius: var(--radius-sm);
    overflow: hidden; margin-bottom: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .card-cover img {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
  }
  .card-cover .no-cover {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    color: var(--meta); font-size: 12px;
  }
  .card-cover .no-cover .nav-icon { width: 32px; height: 32px; }

  .card-name { font-size: 16px; font-weight: 600; color: var(--fg-2); margin-bottom: 6px; }
  .card-geo { font-size: 12px; color: var(--accent); font-weight: 500; margin-bottom: 4px; }
  .card-date { font-size: 12px; color: var(--meta); margin-bottom: 12px; }

  .card-actions { display: flex; gap: 8px; }
  .card-actions .btn { flex: 1; justify-content: center; }

  .btn {
    padding: 8px 14px; border-radius: var(--radius-sm);
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: background 0.15s; border: none; font-family: inherit;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-danger { background: transparent; color: var(--meta); border: 1px solid var(--border-solid); }
  .btn-danger:hover { border-color: var(--danger); color: var(--danger); }

  .empty {
    text-align: center; padding: 80px 20px; color: var(--muted);
    display: none;
  }
  .empty .icon { margin-bottom: 12px; }
  .empty .icon .nav-icon { width: 48px; height: 48px; }
  .empty p { font-size: 15px; margin-bottom: 8px; }
  .empty a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .empty a:hover { text-decoration: underline; }
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth-guard.js"></script>
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>
<div id="sidebar"></div>


<main>
  <h1>灯光预设</h1>
  <p class="subtitle">管理已保存的 3D 打光方案 — 点击应用快速切换</p>

  <div class="toolbar">
    <input class="search" placeholder="搜索方案名称…" id="search">
  </div>

  <div class="grid" id="grid"></div>

  <div class="empty" id="empty">
    <div class="icon"><i data-lucide="lightbulb" class="nav-icon"></i></div>
    <p>还没有保存灯光方案，去 3D 预览试试</p>
    <a href="/preview">打开 3D 预览</a>
  </div>
</main>

<script>
  var geoLabels = { sphere: '球体', cube: '立方体', cylinder: '圆柱体', stl: 'STL模型' };
  var presets = [];

  function loadPresets() {
    var q = (document.getElementById('search')?.value || '').toLowerCase();
    window.getPresets().then(function(list) {
      presets = q ? list.filter(function(p) { return p.name.toLowerCase().includes(q); }) : list;
      render();
    }).catch(function() {
      presets = [];
      render();
    });
  }

  function render() {
    var grid = document.getElementById('grid');
    var empty = document.getElementById('empty');
    if (!grid) return;

    if (!presets.length) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    var html = '';
    for (var i = 0; i < presets.length; i++) {
      var p = presets[i];
      var date = p.createdAt ? new Date(p.createdAt).toLocaleDateString('zh-CN') : '';
      var geoLabel = p.geometryType === 'stl' && p.stlFileName ? ('STL: ' + escapeHtml(p.stlFileName)) : (geoLabels[p.geometryType] || p.geometryType || '未知');
      var coverHtml = p.coverImagePath
        ? '<img class="cover-img" data-pid="' + p.id + '" alt="" style="width:100%;height:100%;object-fit:cover">'
        : '<div class="no-cover"><i data-lucide="image" class="nav-icon"></i><span>无封面</span></div>';

      html += '<div class="card">' +
        '<div class="card-cover">' + coverHtml + '</div>' +
        '<div class="card-name">' + escapeHtml(p.name) + '</div>' +
        '<div class="card-geo">' + geoLabel + '</div>' +
        '<div class="card-date">' + date + '</div>' +
        '<div class="card-actions">' +
        '<button class="btn btn-primary btn-sm" onclick="applyPreset(\'' + p.id + '\')">应用</button>' +
        '<button class="btn btn-danger btn-sm" onclick="deletePresetById(\'' + p.id + '\')">删除</button>' +
        '</div></div>';
    }
    grid.innerHTML = html;
    lucide.createIcons();
    loadCoverImages();
  }

  function loadCoverImages() {
    var token = localStorage.getItem('token');
    if (!token) return;
    document.querySelectorAll('.cover-img').forEach(function(img) {
      var id = img.dataset.pid;
      fetch('/api/lighting-presets/' + id + '/cover', { headers: { 'Authorization': 'Bearer ' + token } })
        .then(function(r) { if (r.ok) return r.blob(); throw new Error('no cover'); })
        .then(function(blob) { img.src = URL.createObjectURL(blob); })
        .catch(function() { img.style.display = 'none'; });
    });
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s || ''));
    return d.innerHTML;
  }

  function applyPreset(id) {
    window.location.href = '/preview?preset=' + encodeURIComponent(id);
  }

  function deletePresetById(id) {
    if (!confirm('删除此照明方案？')) return;
    window.deletePreset(id).then(function() { loadPresets(); }).catch(function() { alert('删除失败'); });
  }

  var searchTimer = 0;
  document.getElementById('search')?.addEventListener('input', function() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadPresets, 250);
  });

  loadPresets();
lucide.createIcons();
</script>
<script src="js/layout.js"></script>
</body>
</html>
