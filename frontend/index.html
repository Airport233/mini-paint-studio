<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HobbyMix — 模型漆料管理</title>
<style>
  :root {
    --bg:           #313338;
    --surface:      #2b2d31;
    --surface-warm: #1e1f22;
    --fg:           #dbdee1;
    --fg-2:         #f2f3f5;
    --muted:        #949ba4;
    --meta:         #80848e;
    --border:       rgba(255, 255, 255, 0.06);
    --border-solid: #3f4147;
    --accent:       #5865f2;
    --accent-hover: #4752c4;
    --radius-sm:    4px;
    --radius-md:    8px;
    --font:         "gg sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono:         "gg mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    display: flex;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Sidebar ---- */
  nav {
    width: 240px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px 8px;
  }
  nav .brand {
    font-size: 16px;
    font-weight: 700;
    color: var(--fg-2);
    padding: 0 8px 20px;
  }
  nav .brand span { color: var(--accent); }

  nav a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    color: var(--meta);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    transition: background 0.15s, color 0.15s;
    margin-bottom: 2px;
  }
  nav a .nav-icon { width: 18px; height: 18px; flex-shrink: 0; }
  nav a:hover,
  nav a.active {
    background: rgba(78, 80, 88, 0.3);
    color: var(--fg);
  }
  nav a.active {
    background: rgba(78, 80, 88, 0.6);
  }
  nav .user-row {
    margin-top: auto;
    padding: 8px 12px;
    font-size: 13px;
    color: var(--meta);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  nav .user-row .logout {
    margin-left: auto;
    color: var(--muted);
    cursor: pointer;
    font-size: 11px;
    text-decoration: none;
  }
  nav .user-row .logout:hover { color: var(--danger); }

  /* ---- Main ---- */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 40px 48px;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    color: var(--fg-2);
    margin-bottom: 8px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 32px;
  }

  /* ---- Hero ---- */
  .hero {
    text-align: center;
    padding: 40px 0 48px;
  }
  .hero .logo {
    font-size: 48px;
    font-weight: 800;
    color: var(--fg-2);
    margin-bottom: 8px;
  }
  .hero .logo span { color: var(--accent); }
  .hero p {
    color: var(--muted);
    font-size: 16px;
    max-width: 480px;
    margin: 0 auto;
  }

  /* ---- Feature Grid ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    max-width: 900px;
    margin: 0 auto;
  }
  .card {
    background: var(--surface);
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    padding: 24px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.2s;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card:hover {
    border-color: var(--border-solid);
    transform: translateY(-2px);
  }
  .card .icon {
    font-size: 32px;
  }
  .icon .nav-icon, .card .icon .nav-icon { width: 32px; height: 32px; }
  .empty .icon .nav-icon { width: 48px; height: 48px; }
  .card .title {
    font-size: 16px;
    font-weight: 700;
    color: var(--fg-2);
  }
  .card .desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }
  .card .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    align-self: flex-start;
  }
  .card .tag.wip {
    background: #4e5058;
  }
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth-guard.js"></script>
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>
<div id="sidebar"></div>


<main>
  <div class="hero">
    <div class="logo"><i data-lucide="palette" class="nav-icon"></i> <span>Hobby</span>Mix</div>
    <p>微缩模型涂装玩家的配色工作站 — 录入漆料、计算配方、3D 预览、保存方案</p>
  </div>

  <div class="grid">
    <a class="card" href="/paints">
      <div class="icon"><i data-lucide="palette" class="nav-icon"></i></div>
      <div class="title">漆料库</div>
      <div class="desc">拍照取色录入真实颜色，管理手头所有漆料库存</div>
      <span class="tag">已实现</span>
    </a>

    <a class="card" href="/mix">
      <div class="icon"><i data-lucide="flask-conical" class="nav-icon"></i></div>
      <div class="title">调色引擎</div>
      <div class="desc">目标色 → 整数份数配方，从库存匹配最佳混合方案</div>
      <span class="tag">已实现</span>
    </a>

    <a class="card" href="/color-wheel">
      <div class="icon"><i data-lucide="palette" class="nav-icon"></i></div>
      <div class="title">色彩工具</div>
      <div class="desc">互补色、三角色、类似色 — 弥补色彩理论短板</div>
      <span class="tag">已实现</span>
    </a>

    <a class="card" href="/preview">
      <div class="icon"><i data-lucide="box" class="nav-icon"></i></div>
      <div class="title">3D 预览</div>
      <div class="desc">几何体 + STL 模型上预览材质和光照效果</div>
      <span class="tag wip">开发中</span>
    </a>

    <a class="card" href="/recipes">
      <div class="icon"><i data-lucide="clipboard-list" class="nav-icon"></i></div>
      <div class="title">配方库</div>
      <div class="desc">标签筛选 + 搜索，随手回看已保存的混色方案</div>
      <span class="tag wip">开发中</span>
    </a>

    <a class="card" href="/presets">
      <div class="icon"><i data-lucide="lightbulb" class="nav-icon"></i></div>
      <div class="title">灯光预设</div>
      <div class="desc">保存并回放 3D 场景的多光源配置方案</div>
      <span class="tag wip">开发中</span>
    </a>
  </div>
</main>

<script>
  // Check login state
  var token = localStorage.getItem('token');
  var email = localStorage.getItem('email');
  if (token && email) {
    document.getElementById('user-display').textContent = email;
    document.getElementById('auth-link').textContent = '退出';
    document.getElementById('auth-link').addEventListener('click', function(e) {
      e.preventDefault();
      localStorage.removeItem('token');
      localStorage.removeItem('email');
      location.reload();
    });
  }
lucide.createIcons();
</script>
<script src="js/layout.js"></script>
</body>
</html>
