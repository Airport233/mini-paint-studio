<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 预览 — HobbyMix</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<style>
  :root {
    --bg:           #313338;
    --surface:      #2b2d31;
    --surface-warm: #1e1f22;
    --fg:           #dbdee1;
    --fg-2:         #f2f3f5;
    --muted:        #949ba4;
    --meta:         #80848e;
    --border:       rgba(255, 255, 255, 0.06);
    --border-solid: #3f4147;
    --accent:       #5865f2;
    --accent-hover: #4752c4;
    --danger:       #f23f43;
    --radius-sm:    4px;
    --radius-md:    8px;
    --font:         "gg sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono:         "gg mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    display: flex;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  nav {
    width: 240px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 16px 8px;
  }
  nav .brand { font-size: 16px; font-weight: 700; color: var(--fg-2); padding: 0 8px 20px; display: flex; align-items: center; gap: 8px; }
  nav .brand span { color: var(--accent); }
  nav a {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: var(--radius-sm);
    color: var(--meta); text-decoration: none;
    font-size: 15px; font-weight: 500;
    transition: background 0.15s, color 0.15s;
    margin-bottom: 2px;
  }
  nav a .nav-icon { width: 18px; height: 18px; flex-shrink: 0; }
  nav a:hover, nav a.active { background: rgba(78,80,88,0.3); color: var(--fg); }
  nav a.active { background: rgba(78,80,88,0.6); }

  main { flex: 1; overflow: hidden; padding: 24px 32px; display: flex; flex-direction: column; }
  .page-header { flex-shrink: 0; margin-bottom: 20px; }
  h1 { font-size: 24px; font-weight: 700; color: var(--fg-2); margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 14px; }

  .preview-layout {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-height: 0;
  }

  .canvas-area {
    height: 55%;
    min-height: 300px;
    flex-shrink: 0;
    background: var(--surface-warm);
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .canvas-placeholder {
    text-align: center;
    color: var(--meta);
    font-size: 14px;
  }
  .canvas-icon {
    display: block; margin: 0 auto 12px; color: var(--meta);
  }
  .viewport-badge {
    position: absolute;
    top: 14px; left: 14px;
    font-size: 11px; font-family: var(--mono);
    color: var(--meta);
    background: rgba(0,0,0,0.45);
    padding: 4px 10px; border-radius: var(--radius-sm);
  }
  .canvas-eyedropper {
    position: absolute;
    bottom: 14px; right: 14px;
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-sm);
    color: #fff; font-size: 12px; font-weight: 500;
    cursor: pointer; transition: background 0.15s, border-color 0.15s;
    font-family: var(--font); z-index: 10;
  }
  .canvas-eyedropper:hover { background: rgba(0,0,0,0.85); border-color: var(--accent); }
  .canvas-eyedropper .nav-icon { width: 14px; height: 14px; }

  .pick-result {
    position: absolute;
    bottom: 52px; right: 14px;
    display: none;
    align-items: center; gap: 10px;
    padding: 10px 14px;
    background: rgba(0,0,0,0.82); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: var(--radius-md);
    color: #fff; font-size: 12px; font-family: var(--font);
    z-index: 10;
  }
  .pick-result.visible { display: flex; }
  .pick-result .pick-swatch {
    width: 32px; height: 32px; border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0;
  }
  .pick-result .pick-rgb { font-family: var(--mono); font-size: 11px; color: rgba(255,255,255,0.7); }
  .pick-result .pick-rgb span { color: #fff; font-weight: 600; }
  .pick-result .pick-goto {
    display: flex; align-items: center; gap: 4px;
    padding: 5px 10px; border-radius: var(--radius-sm);
    background: var(--accent); color: #fff;
    border: none; cursor: pointer; font-size: 11px; font-weight: 600;
    font-family: var(--font); white-space: nowrap;
    text-decoration: none;
    transition: background 0.15s;
  }
  .pick-result .pick-goto:hover { background: var(--accent-hover); }
  .pick-result .pick-goto .nav-icon { width: 12px; height: 12px; }
  .pick-result .pick-close {
    width: 22px; height: 22px; border-radius: 50%;
    background: transparent; border: none; color: rgba(255,255,255,0.45);
    cursor: pointer; font-size: 14px; line-height: 1;
    display: grid; place-items: center; flex-shrink: 0;
    margin-left: 2px; transition: background 0.15s, color 0.15s;
  }
  .pick-result .pick-close:hover { background: rgba(255,255,255,0.1); color: #fff; }

  .control-strip {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    flex-shrink: 1;
    overflow-y: auto;
    align-items: start;
    padding-right: 4px;
  }
  @media (max-width: 900px) { .control-strip { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .control-strip { grid-template-columns: 1fr; } }
  .col-left, .col-right {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }


  .panel {
    background: var(--surface);
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    padding: 18px;
    display: flex;
    flex-direction: column;
  }
  .panel h3 {
    font-size: 13px; font-weight: 700; color: var(--fg-2);
    margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
    flex-shrink: 0;
  }

  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--border-solid);
    background: transparent; color: var(--muted); transition: 0.15s;
    user-select: none;
  }
  .chip:hover, .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .slider-row { margin-bottom: 10px; }
  .slider-row:last-child { margin-bottom: 0; }
  .slider-row label {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--muted); margin-bottom: 3px;
  }
  .slider-row label span { font-family: var(--mono); }
  .slider-row input[type=range] { width: 100%; accent-color: var(--accent); height: 4px; }

  .field-input {
    width: 100%;
    padding: 7px 10px; border-radius: var(--radius-sm);
    background: var(--surface-warm); border: 1px solid var(--border-solid);
    color: var(--fg); font-family: var(--mono); font-size: 12px; outline: none;
  }
  .field-input:focus { border-color: var(--accent); }

  /* ── Color picker: swatch + R/G/B ── */
  .cp-row { display: flex; align-items: center; gap: 10px; position: relative; }
  .cp-swatch {
    width: 40px; height: 40px; border-radius: var(--radius-sm);
    cursor: pointer; border: 2px solid var(--border-solid);
    flex-shrink: 0; transition: border-color 0.15s;
  }
  .cp-swatch:hover { border-color: var(--fg); }
  .cp-rgb { display: flex; gap: 6px; flex: 1; }
  .cp-field { flex: 1; min-width: 0; }
  .cp-field label {
    display: block; font-size: 10px; font-weight: 600;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.04em; margin-bottom: 2px;
  }
  .cp-field input {
    width: 100%; padding: 5px 6px; border-radius: var(--radius-sm);
    background: var(--surface-warm); border: 1px solid var(--border-solid);
    color: var(--fg); font-size: 12px; font-family: var(--mono);
    text-align: center; outline: none;
  }
  .cp-field input:focus { border-color: var(--accent); }
  .cp-field input[type=number]::-webkit-inner-spin-button,
  .cp-field input[type=number]::-webkit-outer-spin-button { opacity: 1; height: 22px; }

  /* ── STL Upload ── */
  .upload-zone {
    border: 2px dashed var(--border-solid);
    border-radius: var(--radius-md);
    padding: 20px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin-top: 8px;
    display: block;
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent);
    background: rgba(88, 101, 242, 0.05);
  }
  .upload-zone .upload-text {
    font-size: 13px; color: var(--muted);
    margin-bottom: 4px;
  }
  .upload-zone .upload-hint {
    font-size: 11px; color: var(--meta);
  }
  .upload-zone input[type=file] { display: none; }

  /* ── Light list ── */
  .light-list {
    display: flex; flex-direction: column; gap: 6px;
    margin-bottom: 8px;
  }
  .light-row {
    background: var(--surface-warm);
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    cursor: pointer;
    transition: border-color 0.15s;
    overflow: hidden;
  }
  .light-row:hover { border-color: var(--border-solid); }
  .light-row.expanded { border-color: var(--accent); }

  .light-row-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
  }
  .light-color-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--border-solid); flex-shrink: 0;
  }
  .light-info { flex: 1; min-width: 0; }
  .light-info .light-name {
    font-size: 13px; font-weight: 600; color: var(--fg-2);
  }
  .light-info .light-meta {
    font-size: 11px; color: var(--meta); margin-top: 1px;
  }
  .light-type-badge {
    font-size: 10px; padding: 2px 7px; border-radius: 999px;
    background: rgba(88, 101, 242, 0.12); color: var(--accent);
    white-space: nowrap;
  }
  .light-chevron {
    width: 16px; height: 16px; color: var(--meta);
    transition: transform 0.2s; flex-shrink: 0;
  }
  .light-row.expanded .light-chevron { transform: rotate(180deg); }

  .light-drawer {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease, padding 0.25s ease;
    padding: 0 12px;
  }
  .light-row.expanded .light-drawer {
    max-height: 560px;
    padding: 0 12px 12px;
  }
  .light-drawer .field-row {
    display: flex; gap: 8px; margin-bottom: 8px;
  }
  .light-drawer .field-row .field-col { flex: 1; }
  .light-drawer label {
    display: block; font-size: 10px; font-weight: 600;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.04em; margin-bottom: 3px;
  }
  .light-drawer .drawer-actions {
    display: flex; gap: 6px; justify-content: flex-end;
    margin-top: 4px;
  }

  .btn {
    padding: 8px 14px; border-radius: var(--radius-sm);
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: background 0.15s; border: none; font-family: inherit;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .btn .nav-icon { width: 14px; height: 14px; flex-shrink: 0; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: #4e5058; color: #fff; }
  .btn-secondary:hover { background: #6d6f78; }
  .btn-ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border-solid);
  }
  .btn-ghost:hover { border-color: var(--danger); color: var(--danger); }
  .btn-sm { padding: 5px 10px; font-size: 11px; }

  .panel-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 10px; }
  .panel-actions .btn { flex: 1; justify-content: center; }

  .hook-note {
    font-size: 11px; color: var(--meta);
    padding: 6px 10px; border: 1px dashed var(--border-solid);
    border-radius: var(--radius-sm);
    text-align: center; line-height: 1.5;
    margin-top: 6px;
  }
</style>
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>
<div id="sidebar"></div>


<main>
  <div class="page-header">
    <h1>3D 预览</h1>
    <p class="subtitle">在几何体 / STL 模型上预览材质、光照效果</p>
  </div>

  <div class="preview-layout">

    <div class="canvas-area" id="canvas-container">
      <button class="canvas-eyedropper" id="btn-eyedropper-canvas"><i data-lucide="pipette"></i> 取色器</button>
      <div class="pick-result" id="pick-result">
        <div class="pick-swatch" id="pick-swatch"></div>
        <div class="pick-rgb">R:<span id="pick-r">—</span> G:<span id="pick-g">—</span> B:<span id="pick-b">—</span></div>
        <a class="pick-goto" id="pick-goto" href="#"><i data-lucide="flask-conical"></i> 去调色</a>
        <button class="pick-close" id="pick-close" type="button" title="关闭">&times;</button>
      </div>
    </div>

    <div class="control-strip">

      <div class="col-left">

      <!-- Geometry -->
      <div class="panel">
        <h3>几何体</h3>
        <div class="chip-row">
          <span class="chip active" data-geo="sphere">球体</span>
          <span class="chip" data-geo="cube">立方体</span>
          <span class="chip" data-geo="cylinder">圆柱体</span>
        </div>
        <label class="upload-zone" id="stl-upload-zone">
          <div class="canvas-icon"><i data-lucide="upload" width="28" height="28"></i></div>
          <div class="upload-text">拖拽 STL 文件到此处</div>
          <div class="upload-hint">或点击选择 &middot; 仅 .stl 格式</div>
          <input type="file" accept=".stl" id="stl-input">
        </label>
        <p class="hook-note" id="stl-status">[Hook] 读取 STL &rarr; Three.js BufferGeometry</p>
      </div>

      <!-- Lights -->
      <div class="panel">
        <h3>光源 <span style="font-weight:400;font-size:11px;color:var(--meta)">1&ndash;6 个</span></h3>
        <div class="light-list" id="light-list">

          <div class="light-row expanded" data-light-id="0">
            <div class="light-row-header">
              <span class="light-color-dot" style="background:#FFF8E7"></span>
              <div class="light-info">
                <div class="light-name">主光源</div>
                <div class="light-meta">方向光 &middot; 强度 80% &middot; 5500K</div>
              </div>
              <span class="light-type-badge">方向光</span>
              <i data-lucide="chevron-down" class="light-chevron"></i>
            </div>
            <div class="light-drawer">
              <div class="slider-row">
                <label>强度 <span class="intensity-val">80</span>%</label>
                <input type="range" min="0" max="100" value="80" class="light-intensity">
              </div>
              <div class="slider-row">
                <label>色温 <span class="temp-display">5500</span>K</label>
                <input type="range" min="2000" max="10000" step="100" value="5500" class="light-temp">
              </div>
              <div class="cp-row" style="margin-bottom:8px">
                <div class="cp-swatch light-color-swatch" style="background:rgb(255,248,231);width:32px;height:32px;border-radius:4px" onclick="var p=this.parentElement;var n=p.querySelector('.light-color-native');if(n)n.click()"></div>
                <input type="color" class="light-color-native" value="#FFF8E7" style="position:absolute;opacity:0;width:0;height:0;pointer-events:none" tabindex="-1">
                <div class="cp-rgb">
                  <div class="cp-field"><label>R</label><input type="number" min="0" max="255" value="255" class="light-color-r"></div>
                  <div class="cp-field"><label>G</label><input type="number" min="0" max="255" value="248" class="light-color-g"></div>
                  <div class="cp-field"><label>B</label><input type="number" min="0" max="255" value="231" class="light-color-b"></div>
                </div>
              </div>
              <div class="field-row">
                <div class="field-col">
                  <label>色温 K</label>
                  <input type="number" class="field-input light-temp-val" value="5500" min="2000" max="10000" step="100">
                </div>
              </div>
              <label style="display:block;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 2px">位置</label>
              <div class="slider-row">
                <label>X <span class="light-pos-x-val">3.0</span></label>
                <input type="range" min="-10" max="10" step="0.1" value="3" class="light-pos-x">
              </div>
              <div class="slider-row">
                <label>Y <span class="light-pos-y-val">5.0</span></label>
                <input type="range" min="-10" max="10" step="0.1" value="5" class="light-pos-y">
              </div>
              <div class="slider-row">
                <label>Z <span class="light-pos-z-val">3.0</span></label>
                <input type="range" min="-10" max="10" step="0.1" value="3" class="light-pos-z">
              </div>
              <div class="drawer-actions">
                <button class="btn btn-ghost btn-sm delete-light-btn">移除</button>
              </div>
            </div>
          </div>

          </div>

        </div>
        <button class="btn btn-ghost btn-sm" id="add-light-btn" style="width:100%;justify-content:center;gap:4px">
          <i data-lucide="plus" width="14" height="14"></i> 添加光源
        </button>
        <p class="hook-note">[Hook] Raycaster 拖拽光源位置 &middot; 滚轮推拉距离 &middot; 空白处双击取消</p>
      </div>

      </div><!-- /.col-left -->

      <div class="col-right">

      <!-- Material -->
      <div class="panel">
        <h3>材质</h3>
        <div class="slider-row">
          <label>粗糙度 <span id="rough-val">0.50</span></label>
          <input type="range" min="0" max="1" step="0.01" value="0.5" id="rough-slider">
        </div>
        <div class="slider-row">
          <label>金属度 <span id="metal-val">0.00</span></label>
          <input type="range" min="0" max="1" step="0.01" value="0" id="metal-slider">
        </div>
        <div class="cp-row" style="margin-top:8px">
          <div class="cp-swatch" id="mat-swatch" style="background:rgb(128,128,128)" onclick="document.getElementById('mat-color-native').click()"></div>
          <input type="color" id="mat-color-native" value="#808080" style="position:absolute;opacity:0;width:0;height:0;pointer-events:none" tabindex="-1">
          <div class="cp-rgb">
            <div class="cp-field"><label>R</label><input type="number" min="0" max="255" value="128" id="mat-r"></div>
            <div class="cp-field"><label>G</label><input type="number" min="0" max="255" value="128" id="mat-g"></div>
            <div class="cp-field"><label>B</label><input type="number" min="0" max="255" value="128" id="mat-b"></div>
          </div>
        </div>
        <p class="hook-note" style="margin-top:8px">[Hook] MeshStandardMaterial.color &larr; rgb(r,g,b)</p>
      </div>

      <!-- 模型位置 -->
      <div class="panel">
        <h3>模型位置</h3>
        <div class="slider-row">
          <label>位移 X <span class="geo-pos-x-val">0.0</span></label>
          <input type="range" min="-10" max="10" step="0.1" value="0" class="geo-pos-x">
        </div>
        <div class="slider-row">
          <label>位移 Y <span class="geo-pos-y-val">0.0</span></label>
          <input type="range" min="-10" max="10" step="0.1" value="0" class="geo-pos-y">
        </div>
        <div class="slider-row">
          <label>位移 Z <span class="geo-pos-z-val">0.0</span></label>
          <input type="range" min="-10" max="10" step="0.1" value="0" class="geo-pos-z">
        </div>
        <div class="slider-row">
          <label>旋转 X <span class="geo-rot-x-val">0</span>&deg;</label>
          <input type="range" min="-180" max="180" step="1" value="0" class="geo-rot-x">
        </div>
        <div class="slider-row">
          <label>旋转 Y <span class="geo-rot-y-val">0</span>&deg;</label>
          <input type="range" min="-180" max="180" step="1" value="0" class="geo-rot-y">
        </div>
        <div class="slider-row">
          <label>旋转 Z <span class="geo-rot-z-val">0</span>&deg;</label>
          <input type="range" min="-180" max="180" step="1" value="0" class="geo-rot-z">
        </div>
        <button class="btn btn-secondary" id="btn-reset-transform" style="margin-top:8px;width:100%">↺ 重置变换</button>
      </div>



      <!-- Actions -->
      <div class="panel">
        <h3>操作</h3>
        <div class="panel-actions">
          <button class="btn btn-secondary" id="btn-save"><i data-lucide="hard-drive" class="nav-icon"></i> 保存方案</button>
        </div>
        <p class="hook-note" style="margin-top:8px">[Hook] 预设打光方案快捷切换下拉</p>
      </div>

      </div><!-- /.col-right -->

    </div>
  </div>

<script>
// ---- Geometry switching ----
document.querySelectorAll('.chip[data-geo]').forEach(function(c) {
  c.addEventListener('click', function() {
    document.querySelectorAll('.chip[data-geo]').forEach(function(x) { x.classList.remove('active'); });
    c.classList.add('active');
    debouncedSave();
    // Hook: switch geometry in Three.js scene
  });
});


// ---- Material sliders live update ----
document.getElementById('rough-slider').addEventListener('input', function() {
  document.getElementById('rough-val').textContent = parseFloat(this.value).toFixed(2);
  debouncedSave();
  // Hook: mesh.material.roughness = this.value
});
document.getElementById('metal-slider').addEventListener('input', function() {
  document.getElementById('metal-val').textContent = parseFloat(this.value).toFixed(2);
  debouncedSave();
  // Hook: mesh.material.metalness = this.value
});
// ---- Model position/rotation sliders ----
['pos-x','pos-y','pos-z','rot-x','rot-y','rot-z'].forEach(function(axis) {
  document.querySelectorAll('.geo-' + axis).forEach(function(el) {
    el.addEventListener('input', function() {
      var val = axis.startsWith('rot') ? parseInt(this.value) : parseFloat(this.value).toFixed(1);
      var suffix = axis.startsWith('rot') ? '&deg;' : '';
      var span = document.querySelector('.geo-' + axis + '-val');
      if (span) span.innerHTML = val + suffix;
      debouncedSave();
    });
  });
});
// ---- Material color swatch + R/G/B sync ----
var matR = document.getElementById('mat-r');
var matG = document.getElementById('mat-g');
var matB = document.getElementById('mat-b');
var matSwatch = document.getElementById('mat-swatch');
var matNative = document.getElementById('mat-color-native');

function rgbFromHex(h) {
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
function hexFromRgb(r,g,b) {
  return '#' + ((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1).toUpperCase();
}

/* ── State persistence ── */
var STORE_KEY = 'preview:state';
var saveTimer = null;
function debouncedSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 150);
}
function saveState() {
  try {
    var geo = document.querySelector('.chip[data-geo].active');
    var lights = [];
    document.querySelectorAll('.light-row').forEach(function(row) {
      lights.push({
        expanded: row.classList.contains('expanded'),
        name: row.querySelector('.light-name').textContent,
        type: row.querySelector('.light-type-badge').textContent,
        intensity: parseInt(row.querySelector('.light-intensity').value),
        temp: parseInt(row.querySelector('.light-temp').value),
        color: { r: parseInt(row.querySelector('.light-color-r').value), g: parseInt(row.querySelector('.light-color-g').value), b: parseInt(row.querySelector('.light-color-b').value) },
        pos: { x: parseFloat(row.querySelector('.light-pos-x').value), y: parseFloat(row.querySelector('.light-pos-y').value), z: parseFloat(row.querySelector('.light-pos-z').value) }
      });
    });
    var st = {
      geometry: geo ? geo.dataset.geo : 'sphere',
      roughness: document.getElementById('rough-slider').value,
      metalness: document.getElementById('metal-slider').value,
      matColor: { r: +matR.value, g: +matG.value, b: +matB.value },
      modelPos: { x: parseFloat(document.querySelector('.geo-pos-x')?.value||0), y: parseFloat(document.querySelector('.geo-pos-y')?.value||0), z: parseFloat(document.querySelector('.geo-pos-z')?.value||0) },
      modelRot: { x: parseInt(document.querySelector('.geo-rot-x')?.value||0), y: parseInt(document.querySelector('.geo-rot-y')?.value||0), z: parseInt(document.querySelector('.geo-rot-z')?.value||0) },
      lights: lights
    };
    var js = JSON.stringify(st);
    try { var d = window.name ? JSON.parse(window.name) : {}; d[STORE_KEY] = js; window.name = JSON.stringify(d); } catch (_) {}
    try { localStorage.setItem(STORE_KEY, js); } catch (_) {}
  } catch (_) {}
}
function makeLightHTML(l) {
  var hex = hexFromRgb(l.color.r, l.color.g, l.color.b);
  return '<div class="light-row-header">' +
    '<span class="light-color-dot" style="background:rgb(' + l.color.r + ',' + l.color.g + ',' + l.color.b + ')"></span>' +
    '<div class="light-info"><div class="light-name">' + l.name + '</div><div class="light-meta">' + l.type + ' &middot; 强度 ' + l.intensity + '% &middot; ' + l.temp + 'K</div></div>' +
    '<span class="light-type-badge">' + l.type + '</span>' +
    '<i data-lucide="chevron-down" class="light-chevron"></i></div>' +
    '<div class="light-drawer">' +
    '<div class="slider-row"><label>强度 <span class="intensity-val">' + l.intensity + '</span>%</label><input type="range" min="0" max="100" value="' + l.intensity + '" class="light-intensity"></div>' +
    '<div class="slider-row"><label>色温 <span class="temp-display">' + l.temp + '</span>K</label><input type="range" min="2000" max="10000" step="100" value="' + l.temp + '" class="light-temp"></div>' +
    '<div class="cp-row" style="margin-bottom:8px">' +
    '<div class="cp-swatch light-color-swatch" style="background:rgb(' + l.color.r + ',' + l.color.g + ',' + l.color.b + ');width:32px;height:32px;border-radius:4px" onclick="var p=this.parentElement;var n=p.querySelector(\'.light-color-native\');if(n)n.click()"></div>' +
    '<input type="color" class="light-color-native" value="' + hex + '" style="position:absolute;opacity:0;width:0;height:0;pointer-events:none" tabindex="-1">' +
    '<div class="cp-rgb">' +
    '<div class="cp-field"><label>R</label><input type="number" min="0" max="255" value="' + l.color.r + '" class="light-color-r"></div>' +
    '<div class="cp-field"><label>G</label><input type="number" min="0" max="255" value="' + l.color.g + '" class="light-color-g"></div>' +
    '<div class="cp-field"><label>B</label><input type="number" min="0" max="255" value="' + l.color.b + '" class="light-color-b"></div></div></div>' +
    '<div class="field-row"><div class="field-col"><label>色温 K</label><input type="number" class="field-input light-temp-val" value="' + l.temp + '" min="2000" max="10000" step="100"></div></div>' +
    '<label style="display:block;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 2px">位置</label>' +
    '<div class="slider-row"><label>X <span class="light-pos-x-val">' + l.pos.x.toFixed(1) + '</span></label><input type="range" min="-10" max="10" step="0.1" value="' + l.pos.x + '" class="light-pos-x"></div>' +
    '<div class="slider-row"><label>Y <span class="light-pos-y-val">' + l.pos.y.toFixed(1) + '</span></label><input type="range" min="-10" max="10" step="0.1" value="' + l.pos.y + '" class="light-pos-y"></div>' +
    '<div class="slider-row"><label>Z <span class="light-pos-z-val">' + l.pos.z.toFixed(1) + '</span></label><input type="range" min="-10" max="10" step="0.1" value="' + l.pos.z + '" class="light-pos-z"></div>' +
    '<div class="drawer-actions"><button class="btn btn-ghost btn-sm delete-light-btn">移除</button></div></div>';
}
function loadState() {
  try {
    var raw = null;
    try { raw = JSON.parse(window.name || '{}')[STORE_KEY] || localStorage.getItem(STORE_KEY); } catch (_) { raw = localStorage.getItem(STORE_KEY); }
    if (!raw) return;
    var st = JSON.parse(raw);

    // Geometry
    document.querySelectorAll('.chip[data-geo]').forEach(function(c) {
      c.classList.toggle('active', c.dataset.geo === st.geometry);
    });

    // Material sliders
    var rs = document.getElementById('rough-slider');
    rs.value = st.roughness;
    document.getElementById('rough-val').textContent = parseFloat(st.roughness).toFixed(2);
    var ms = document.getElementById('metal-slider');
    ms.value = st.metalness;
    document.getElementById('metal-val').textContent = parseFloat(st.metalness).toFixed(2);

    // Material color
    matR.value = st.matColor.r; matG.value = st.matColor.g; matB.value = st.matColor.b;
    syncMatFromRgb(st.matColor.r, st.matColor.g, st.matColor.b);

    // Model position/rotation
    ['x','y','z'].forEach(function(a) {
      var pel = document.querySelector('.geo-pos-' + a);
      if (pel) { pel.value = st.modelPos[a]; document.querySelector('.geo-pos-' + a + '-val').textContent = st.modelPos[a].toFixed(1); }
      var rel = document.querySelector('.geo-rot-' + a);
      if (rel) { rel.value = st.modelRot[a]; document.querySelector('.geo-rot-' + a + '-val').innerHTML = st.modelRot[a] + '&deg;'; }
    });

    // Rebuild light list
    if (st.lights && st.lights.length) {
      var list = document.getElementById('light-list');
      list.innerHTML = '';
      st.lights.forEach(function(l, i) {
        var el = document.createElement('div');
        el.className = 'light-row' + (l.expanded ? ' expanded' : '');
        el.setAttribute('data-light-id', i);
        el.innerHTML = makeLightHTML(l);
        list.appendChild(el);
      });
      lightIdCounter = st.lights.length;
      lucide.createIcons();
    }
  } catch (_) {}
}
function syncMatFromRgb(r,g,b) {
  var hex = hexFromRgb(r,g,b);
  matSwatch.style.background = 'rgb(' + r + ',' + g + ',' + b + ')';
  matNative.value = hex;
  // Hook: mesh.material.color.set(hex)
}
matNative.addEventListener('input', function() {
  var rgb = rgbFromHex(this.value);
  matR.value = rgb[0]; matG.value = rgb[1]; matB.value = rgb[2];
  syncMatFromRgb(rgb[0], rgb[1], rgb[2]);
});
[matR, matG, matB].forEach(function(el) {
  el.addEventListener('input', function() {
    var r = Math.min(255, Math.max(0, +matR.value || 0));
    var g = Math.min(255, Math.max(0, +matG.value || 0));
    var b = Math.min(255, Math.max(0, +matB.value || 0));
    syncMatFromRgb(r, g, b);
    debouncedSave();
  });
});

// ---- STL upload ----
var stlZone = document.getElementById('stl-upload-zone');
var stlInput = document.getElementById('stl-input');
var stlStatus = document.getElementById('stl-status');

stlZone.addEventListener('click', function(e) {
  if (e.target !== stlInput) stlInput.click();
});

stlZone.addEventListener('dragover', function(e) {
  e.preventDefault();
  stlZone.classList.add('drag-over');
});
stlZone.addEventListener('dragleave', function() {
  stlZone.classList.remove('drag-over');
});
stlZone.addEventListener('drop', function(e) {
  e.preventDefault();
  stlZone.classList.remove('drag-over');
  var file = e.dataTransfer.files[0];
  if (file) handleSTL(file);
});
stlInput.addEventListener('change', function() {
  var file = stlInput.files[0];
  if (file) handleSTL(file);
});

function handleSTL(file) {
  if (!file.name.toLowerCase().endsWith('.stl')) {
    stlStatus.textContent = '请选择 .stl 格式文件';
    return;
  }
  stlStatus.textContent = '[Hook] ' + file.name + ' (' + (file.size/1024).toFixed(1) + ' KB) → STLLoader.parse()';
}

// ---- Light row expand/collapse ----
var lightList = document.getElementById('light-list');
lightList.addEventListener('click', function(e) {
  // Ignore clicks on inputs / buttons inside drawer
  if (e.target.closest('input') || e.target.closest('button')) return;
  var header = e.target.closest('.light-row-header');
  if (!header) return;
  header.closest('.light-row').classList.toggle('expanded');
  debouncedSave();
});

// ---- Live slider updates inside light drawers ----
lightList.addEventListener('input', function(e) {
  var row = e.target.closest('.light-row');
  if (!row) return;
  if (e.target.classList.contains('light-intensity')) {
    row.querySelector('.intensity-val').textContent = e.target.value;
  }
  if (e.target.classList.contains('light-temp')) {
    row.querySelector('.temp-display').textContent = e.target.value;
    row.querySelector('.light-temp-val').value = e.target.value;
  }
  if (e.target.classList.contains('light-temp-val')) {
    var v = parseInt(e.target.value);
    if (v >= 2000 && v <= 10000) {
      row.querySelector('.temp-display').textContent = v;
      row.querySelector('.light-temp').value = v;
    }
  }
  // Light color R/G/B + native picker sync
  if (e.target.classList.contains('light-color-r') ||
      e.target.classList.contains('light-color-g') ||
      e.target.classList.contains('light-color-b')) {
    var r = Math.min(255, Math.max(0, +(row.querySelector('.light-color-r')?.value) || 0));
    var g = Math.min(255, Math.max(0, +(row.querySelector('.light-color-g')?.value) || 0));
    var b = Math.min(255, Math.max(0, +(row.querySelector('.light-color-b')?.value) || 0));
    var hex = hexFromRgb(r, g, b);

    var swatch = row.querySelector('.light-color-swatch');

    var native = row.querySelector('.light-color-native');
    if (native) native.value = hex;
    // Hook: light.color.set(hex)
  }
  if (e.target.classList.contains('light-color-native')) {
    var rgb2 = rgbFromHex(e.target.value);
    var r2 = row.querySelector('.light-color-r');
    var g2 = row.querySelector('.light-color-g');
    var b2 = row.querySelector('.light-color-b');
    if (r2) r2.value = rgb2[0];
    if (g2) g2.value = rgb2[1];
    if (b2) b2.value = rgb2[2];
    row.querySelector('.light-color-dot').style.background = 'rgb(' + rgb2[0] + ',' + rgb2[1] + ',' + rgb2[2] + ')';
    var swatch2 = row.querySelector('.light-color-swatch');
    if (swatch2) swatch2.style.background = 'rgb(' + rgb2[0] + ',' + rgb2[1] + ',' + rgb2[2] + ')';
  }
  // Position sliders — update X/Y/Z display values
  if (e.target.classList.contains('light-pos-x')) {
    var val = parseFloat(e.target.value).toFixed(1);
    row.querySelector('.light-pos-x-val').textContent = val;

  }
  if (e.target.classList.contains('light-pos-y')) {
    var val = parseFloat(e.target.value).toFixed(1);
    row.querySelector('.light-pos-y-val').textContent = val;

  }
  if (e.target.classList.contains('light-pos-z')) {
    var val = parseFloat(e.target.value).toFixed(1);
    row.querySelector('.light-pos-z-val').textContent = val;
    // Hook: light.position.z = val
    debouncedSave();
  }
});

// ---- Delete light ----
lightList.addEventListener('click', function(e) {
  var delBtn = e.target.closest('.delete-light-btn');
  if (!delBtn) return;

// ---- Add light ----
var lightIdCounter = 1;
document.getElementById('add-light-btn').addEventListener('click', function() {

        '<label>强度 <span class="intensity-val">50</span>%</label>' +
        '<input type="range" min="0" max="100" value="50" class="light-intensity">' +
      '</div>' +
      '<div class="slider-row">' +
        '<label>色温 <span class="temp-display">5000</span>K</label>' +
        '<input type="range" min="2000" max="10000" step="100" value="5000" class="light-temp">' +
      '</div>' +
      '<div class="cp-row" style="margin-bottom:8px">' +
        '<div class="cp-swatch light-color-swatch" style="background:rgb(255,255,255);width:32px;height:32px;border-radius:4px" onclick="var p=this.parentElement;var n=p.querySelector(\'.light-color-native\');if(n)n.click()"></div>' +
        '<input type="color" class="light-color-native" value="#FFFFFF" style="position:absolute;opacity:0;width:0;height:0;pointer-events:none" tabindex="-1">' +
        '<div class="cp-rgb">' +
          '<div class="cp-field"><label>R</label><input type="number" min="0" max="255" value="255" class="light-color-r"></div>' +
          '<div class="cp-field"><label>G</label><input type="number" min="0" max="255" value="255" class="light-color-g"></div>' +
          '<div class="cp-field"><label>B</label><input type="number" min="0" max="255" value="255" class="light-color-b"></div>' +
        '</div>' +

      '<div class="slider-row">' +
        '<label>X <span class="light-pos-x-val">0.0</span></label>' +
        '<input type="range" min="-10" max="10" step="0.1" value="0" class="light-pos-x">' +

      '<div class="slider-row">' +
        '<label>Y <span class="light-pos-y-val">3.0</span></label>' +

        '<label>Z <span class="light-pos-z-val">0.0</span></label>' +

<script>



// ── Scene setup ──
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color('#808080');

const camera = new THREE.PerspectiveCamera(50, 2, 0.1, 100);
camera.position.set(3, 2, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// ── Lights ──
const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambientLight);

const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
mainLight.position.set(2, 3, 2);
scene.add(mainLight);

// ── Grid ──
scene.add(new THREE.GridHelper(10, 20, 0x666666, 0x444444));

// ── Geometry ──
const geometries = {
  sphere: new THREE.SphereGeometry(1, 32, 32),
  cube: new THREE.BoxGeometry(1.5, 1.5, 1.5),
  cylinder: new THREE.CylinderGeometry(1, 1, 2, 32),
};
let currentGeo = 'sphere';
const material = new THREE.MeshStandardMaterial({ color: '#808080', roughness: 0.5, metalness: 0 });
let model = new THREE.Mesh(geometries[currentGeo], material);
scene.add(model);

// ── Geometry selector ──
document.querySelectorAll('.chip[data-geo]').forEach(function (chip) {
  chip.addEventListener('click', function () {
    document.querySelectorAll('.chip[data-geo]').forEach(function (c) { c.classList.remove('active'); });
    chip.classList.add('active');
    currentGeo = chip.dataset.geo;
    model.geometry = geometries[currentGeo];
  });
});

// ── Material sliders ──
var roughSlider = document.getElementById('rough-slider');
var roughVal = document.getElementById('rough-val');
if (roughSlider && roughVal) {
  roughSlider.addEventListener('input', function () {
    material.roughness = parseFloat(roughSlider.value);
    roughVal.textContent = parseFloat(roughSlider.value).toFixed(2);
  });
}

var metalSlider = document.getElementById('metal-slider');
var metalVal = document.getElementById('metal-val');
if (metalSlider && metalVal) {
  metalSlider.addEventListener('input', function () {
    material.metalness = parseFloat(metalSlider.value);
    metalVal.textContent = parseFloat(metalSlider.value).toFixed(2);
  });
}

// Material color — sync mat-r/g/b, swatch, and native picker
function syncMaterialColor(r, g, b) {
  material.color.setRGB(r / 255, g / 255, b / 255);
  var swatch = document.getElementById('mat-swatch');
  var native = document.getElementById('mat-color-native');
  var hex = '#' + [r, g, b].map(function(v) { return v.toString(16).padStart(2, '0'); }).join('');
  if (swatch) swatch.style.background = 'rgb(' + r + ',' + g + ',' + b + ')';
  if (native) native.value = hex;
}

['mat-r', 'mat-g', 'mat-b'].forEach(function(id) {
  var el = document.getElementById(id);
  if (el) {
    el.addEventListener('input', function() {
      var r = parseInt(document.getElementById('mat-r').value) || 128;
      var g = parseInt(document.getElementById('mat-g').value) || 128;
      var b = parseInt(document.getElementById('mat-b').value) || 128;
      syncMaterialColor(r, g, b);
    });
  }
});

var matNative = document.getElementById('mat-color-native');
if (matNative) {
  matNative.addEventListener('input', function() {
    var hex = matNative.value;
    if (/^#[0-9a-fA-F]{6}$/.test(hex)) {
      material.color.set(hex);
      var r = parseInt(hex.slice(1, 3), 16);
      var g = parseInt(hex.slice(3, 5), 16);
      var b = parseInt(hex.slice(5, 7), 16);
      document.getElementById('mat-r').value = r;
      document.getElementById('mat-g').value = g;
      document.getElementById('mat-b').value = b;
      var swatch = document.getElementById('mat-swatch');
      if (swatch) swatch.style.background = hex;
    }
  });
}

// ── Light markers ──
var lightMarkers = [];
// ── Light system (markers, selection, drag, scroll) ──
var selectedLight = null;
var lightMarkers = [];
var raycaster = new THREE.Raycaster();
var mouse = new THREE.Vector2();
var isDragging = false;
var dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0));

function getLights() {
  var lights = [];
  scene.children.forEach(function (c) {
    if (c.isDirectionalLight || c.isPointLight) lights.push(c);
  });
  return lights;
}

function rebuildMarkers() {
  lightMarkers.forEach(function (m) { scene.remove(m); });
  lightMarkers = [];
  var lights = getLights();
  lights.forEach(function (light, i) {
    var geo = new THREE.SphereGeometry(0.12, 12, 12);
    var mat = new THREE.MeshBasicMaterial({ color: light === selectedLight ? 0xffff00 : light.color });
    var marker = new THREE.Mesh(geo, mat);
    marker.position.copy(light.position);
    marker.userData = { lightIndex: i, light: light };
    scene.add(marker);
    lightMarkers.push(marker);
  });
}
rebuildMarkers();

// Click: select / deselect
renderer.domElement.addEventListener('pointerdown', function (e) {
  if (e.target !== renderer.domElement) return;
  var rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  var hits = raycaster.intersectObjects(lightMarkers);
  if (hits.length > 0) {
    selectedLight = hits[0].object.userData.light;
    isDragging = true;
    controls.enabled = false;
    // Set drag plane perpendicular to camera, passing through light position
    var camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    dragPlane.set(camDir.negate(), 1);
    dragPlane.constant = -selectedLight.position.dot(dragPlane.normal);
    rebuildMarkers();
  } else {
    selectedLight = null;
    controls.enabled = true;
    rebuildMarkers();
  }
});

// Drag
renderer.domElement.addEventListener('pointermove', function (e) {
  if (!isDragging || !selectedLight) return;
  var rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  var intersection = new THREE.Vector3();
  raycaster.ray.intersectPlane(dragPlane, intersection);
  if (intersection) {
    selectedLight.position.copy(intersection);
    lightMarkers.forEach(function (m) {
      if (m.userData.light === selectedLight) m.position.copy(intersection);
    });
  }
});

// Release
renderer.domElement.addEventListener('pointerup', function () {
  isDragging = false;
});

// Scroll: move selected light along camera ray
renderer.domElement.addEventListener('wheel', function (e) {
  if (!selectedLight) return;
  e.preventDefault();
  e.stopPropagation();
  var dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  var delta = e.deltaY > 0 ? 0.3 : -0.3;
  selectedLight.position.addScaledVector(dir, delta);
  lightMarkers.forEach(function (m) {
    if (m.userData.light === selectedLight) m.position.copy(selectedLight.position);
  });
}, { passive: false });

// ── Model transform controls ──
var modelParent = new THREE.Group();
scene.remove(model);
scene.add(modelParent);
modelParent.add(model);
model.position.set(0, 0, 0);

// Reset transform
var resetBtn = document.getElementById('btn-reset-transform');
if (resetBtn) {
  resetBtn.addEventListener('click', function () {
    ['x', 'y', 'z'].forEach(function (axis) {
      var ps = document.querySelector('.geo-pos-' + axis);
      var rs = document.querySelector('.geo-rot-' + axis);
      if (ps) { ps.value = 0; ps.dispatchEvent(new Event('input')); }
      if (rs) { rs.value = 0; rs.dispatchEvent(new Event('input')); }
    });
    modelParent.position.set(0, 0, 0);
    modelParent.rotation.set(0, 0, 0);
  });
}

// Axis mapping: Three.js Y=up, Z=depth. Prototype labels Y/Z are swapped.
var posMap = { x: 'x', y: 'z', z: 'y' };
var rotMap = { x: 'x', y: 'z', z: 'y' };

['x', 'y', 'z'].forEach(function (axis) {
  var slider = document.querySelector('.geo-pos-' + axis);
  var label = document.querySelector('.geo-pos-' + axis + '-val');
  if (slider && label) {
    slider.addEventListener('input', function () {
      modelParent.position[posMap[axis]] = parseFloat(slider.value);
      label.textContent = parseFloat(slider.value).toFixed(1);
    });
  }
});

['x', 'y', 'z'].forEach(function (axis) {
  var slider = document.querySelector('.geo-rot-' + axis);
  var label = document.querySelector('.geo-rot-' + axis + '-val');
  if (slider && label) {
    slider.addEventListener('input', function () {
      var rx = THREE.MathUtils.degToRad(parseFloat(document.querySelector('.geo-rot-x').value) || 0);
      var ry = THREE.MathUtils.degToRad(parseFloat(document.querySelector('.geo-rot-y').value) || 0);
      var rz = THREE.MathUtils.degToRad(parseFloat(document.querySelector('.geo-rot-z').value) || 0);
      modelParent.rotation.set(rx, rotMap.y === 'z' ? rz : ry, rotMap.z === 'y' ? ry : rz);
      label.textContent = slider.value + '°';
    });
  }
});

// ── Init: reset to defaults on page load ──
syncMaterialColor(128, 128, 128);
document.getElementById('rough-slider').value = 0.5;
document.getElementById('rough-val').textContent = '0.50';
document.getElementById('metal-slider').value = 0;
document.getElementById('metal-val').textContent = '0.00';
material.roughness = 0.5;
material.metalness = 0;

// ── Canvas picker ──
var eyedropperBtn = document.getElementById('btn-eyedropper-canvas');
if (eyedropperBtn) {
  eyedropperBtn.addEventListener('click', function () {
    var canvas = renderer.domElement;
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    if (!ctx) {
      // Use toDataURL + image approach
      var img = new Image();
      img.src = canvas.toDataURL();
      img.onload = function () {
        var tempCanvas = document.createElement('canvas');
        tempCanvas.width = img.width; tempCanvas.height = img.height;
        tempCanvas.getContext('2d').drawImage(img, 0, 0);
        tempCanvas.style.cursor = 'crosshair';
        tempCanvas.style.position = 'absolute';
        tempCanvas.style.inset = '0';
        tempCanvas.style.zIndex = '20';
        container.appendChild(tempCanvas);
        tempCanvas.addEventListener('click', function (e) {
          var rect = tempCanvas.getBoundingClientRect();
          var x = Math.round((e.clientX - rect.left) * (tempCanvas.width / rect.width));
          var y = Math.round((e.clientY - rect.top) * (tempCanvas.height / rect.height));
          var px = tempCanvas.getContext('2d').getImageData(x, y, 1, 1).data;
          showPickResult(px[0], px[1], px[2]);
          tempCanvas.remove();
        });
      };
    }
  });
}

function showPickResult(r, g, b) {
  var pr = document.getElementById('pick-result');
  if (!pr) return;
  document.getElementById('pick-swatch').style.background = 'rgb(' + r + ',' + g + ',' + b + ')';
  document.getElementById('pick-r').textContent = r;
  document.getElementById('pick-g').textContent = g;
  document.getElementById('pick-b').textContent = b;
  document.getElementById('pick-goto').href = '/mix?r=' + r + '&g=' + g + '&b=' + b;
  pr.classList.add('visible');
}

// Clean up old close handler
var pickClose = document.getElementById('pick-close');
if (pickClose) {
  pickClose.onclick = function () {
    document.getElementById('pick-result').classList.remove('visible');
  };
}

// ── Resize + render loop ──
function resize() {
  var rect = container.getBoundingClientRect();
  renderer.setSize(rect.width, rect.height);
  camera.aspect = rect.width / Math.max(rect.height, 1);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
